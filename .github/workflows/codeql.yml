name: CodeQL

# VOL-143: SAST coverage. Runs the GitHub-managed CodeQL static analyzer
# against Swift (app + tests) and JavaScript/TypeScript (relay Worker)
# code. Findings surface in the repo's Security tab. We pin to the
# `github/codeql-action` v3 family.
#
# Schedule + triggers:
# - Push to main: full scan after each merge so a regression surfaces
#   quickly. Uses the same job-scoped GITHUB_TOKEN as ci.yml.
# - Weekly cron (Sunday 03:00 UTC): catches new vulnerability rules
#   that ship in CodeQL itself between our merges.
# - Manual dispatch: ad-hoc scans for spelunking or pre-release sweeps.
#
# Deliberately NOT triggered on PRs to keep the main CI cycle short
# (a Swift CodeQL build takes ~30 min on a hosted Mac). The weekly
# cron + main-push runs are sufficient for find-rate; PR runs would
# be redundant for the most-recently-changed code that the sticky
# coverage comment + AI review gate already cover.

on:
  push:
    branches: [main]
  schedule:
    - cron: '0 3 * * 0'
  workflow_dispatch:

permissions:
  contents: read
  security-events: write
  actions: read

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    # Self-hosted by policy (zero GitHub-hosted jobs across the repo).
    # The runner is macOS Apple Silicon with Xcode 26.4, which satisfies
    # CodeQL's Swift extractor; the JS/TS extractor runs on any host
    # CodeQL supports, including macOS. Swift CodeQL is slow (~30 min)
    # but only runs on push to main + weekly cron + manual dispatch,
    # so the queue impact on PR builds is bounded.
    runs-on: [self-hosted, mv-volumearc-runner]
    timeout-minutes: 60

    strategy:
      fail-fast: false
      matrix:
        language: [swift, javascript-typescript]

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      # VOL-180: CodeQL helpers shipped by `github/codeql-action/init@v4`
      # arrive on the self-hosted macOS runner with the
      # `com.apple.quarantine` xattr set (Gatekeeper marks any binary
      # extracted from a download tarball). The xattr blocks
      # `child_process.spawn` from launching the helper, surfacing as
      # the cryptic `Error: spawn Unknown system error -86`
      # (`ENEEDAUTH`) in `Post Initialize CodeQL`. Strip the attribute
      # recursively across the runner's tool / work caches before
      # `Initialize CodeQL` so the helpers can launch.
      #
      # Conservative: only the directories CodeQL actually reads from
      # are touched, and a missing directory is non-fatal so first-run
      # workspaces don't fail this step.
      - name: Strip quarantine xattr from runner caches (VOL-180)
        run: |
          set -uo pipefail
          declare -a paths=(
            "${RUNNER_TEMP:-}"
            "${RUNNER_TOOL_CACHE:-}"
            "${RUNNER_WORKSPACE:-}"
            "$HOME/_work/_actions/github/codeql-action"
            "$HOME/_work/_tool"
          )
          for path in "${paths[@]}"; do
            [[ -n "$path" && -d "$path" ]] || continue
            xattr -dr com.apple.quarantine "$path" 2>/dev/null || true
          done
          echo "VOL-180 quarantine strip complete"
        shell: bash

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          # `security-extended` adds rules beyond the default suite —
          # not as exhaustive as `security-and-quality` but a better
          # signal-to-noise ratio for an app codebase.
          queries: security-extended

      # CodeQL builds the code itself for compiled languages. Swift
      # uses the autobuild path which runs `xcodebuild` against the
      # generated project.
      - name: Generate Xcode project (Swift only)
        if: matrix.language == 'swift'
        run: ruby scripts/generate_xcode_project.rb

      - name: Autobuild
        uses: github/codeql-action/autobuild@v4

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@v4
        with:
          category: '/language:${{ matrix.language }}'
          # Upload SARIF to the Security tab even on partial failures
          # so we still see the findings the analyzer DID extract.
          upload: always
