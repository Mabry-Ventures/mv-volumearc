name: CodeQL

# VOL-143: SAST coverage. Runs the GitHub-managed CodeQL static analyzer
# against the Swift app + tests. Findings surface in the repo's
# Security tab.
#
# VOL-180 Phase 2 (2026-05-17): scope reduced + manual build mode.
#
# - **JavaScript-TypeScript dropped from the matrix.** The relay
#   Worker is ~200 LOC TS; SAST on it requires GitHub Advanced
#   Security on this private repo (≈$49/mo/committer). Trufflehog
#   already covers secret scanning; CodeRabbit + Codex review the
#   Worker code on every PR; the cost/benefit doesn't pencil out
#   right now. Re-add if/when GHAS is enabled.
#
# - **Swift switched from `autobuild` to `manual` build mode.** The
#   default `autobuild` invokes `xcodebuild` against the host macOS
#   SDK, which fails on iOS-26-targeted Foundation APIs (`.now`,
#   `Logger`, `OSLogMessage`) because they're available in macOS
#   12+ but autobuild builds for older host targets. Manual mode lets
#   us invoke `xcodebuild` with an explicit iOS Simulator destination
#   that matches what `ci.yml` already uses, so CodeQL's tracer sees
#   the same compile invocations production code is built with.
#
# Schedule + triggers:
# - Push to main: full scan after each merge so a regression surfaces
#   quickly. Uses the same job-scoped GITHUB_TOKEN as ci.yml.
# - Weekly cron (Sunday 03:00 UTC): catches new vulnerability rules
#   that ship in CodeQL itself between our merges.
# - Manual dispatch: ad-hoc scans for spelunking or pre-release sweeps.
#
# Deliberately NOT triggered on PRs to keep the main CI cycle short
# (a Swift CodeQL build takes ~30 min). The weekly cron + main-push
# runs are sufficient for find-rate; PR runs would be redundant for
# the most-recently-changed code that the sticky coverage comment +
# AI review gate already cover.

on:
  push:
    branches: [main]
  schedule:
    - cron: '0 3 * * 0'
  workflow_dispatch:

permissions:
  contents: read
  security-events: write
  actions: read

# VOL-184/VOL-192: per-workflow concurrency group keyed on ref. CodeQL
# has its own group so back-to-back main pushes queue (rather than
# cancel) and bot-driven gate-review events don't cancel a pending
# CodeQL run.
concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: false

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    # Self-hosted by policy (zero GitHub-hosted jobs across the repo).
    # The runner is macOS Apple Silicon with Xcode 26.4 — Swift CodeQL
    # extractor requires the same toolchain `ci.yml` uses. The Swift
    # build itself runs ~10-25 min depending on cache state; the
    # 60-minute timeout absorbs cold-cache runs.
    runs-on: [self-hosted, mv-volumearc-runner]
    timeout-minutes: 60

    strategy:
      fail-fast: false
      matrix:
        language: [swift]

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      # VOL-180: CodeQL helpers shipped by `github/codeql-action/init@v4`
      # arrive on the self-hosted macOS runner with the
      # `com.apple.quarantine` xattr set (Gatekeeper marks any binary
      # extracted from a download tarball). The xattr blocks
      # `child_process.spawn` from launching the helper, surfacing as
      # the cryptic `Error: spawn Unknown system error -86`
      # (`ENEEDAUTH`) in `Post Initialize CodeQL`. Strip the attribute
      # recursively across the runner's tool / work caches before
      # `Initialize CodeQL` so the helpers can launch.
      #
      # Conservative: only the directories CodeQL actually reads from
      # are touched, and a missing directory is non-fatal so first-run
      # workspaces don't fail this step.
      - name: Strip quarantine xattr from runner caches (VOL-180)
        run: |
          set -uo pipefail
          declare -a paths=(
            "${RUNNER_TEMP:-}"
            "${RUNNER_TOOL_CACHE:-}"
            "${RUNNER_WORKSPACE:-}"
            "$HOME/_work/_actions/github/codeql-action"
            "$HOME/_work/_tool"
          )
          for path in "${paths[@]}"; do
            [[ -n "$path" && -d "$path" ]] || continue
            xattr -dr com.apple.quarantine "$path" 2>/dev/null || true
          done
          echo "VOL-180 quarantine strip complete"
        shell: bash

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          # VOL-180 Phase 2: `manual` build mode for Swift. Autobuild
          # was hitting macOS-host-SDK build errors on iOS-26 APIs;
          # the explicit `xcodebuild` step below mirrors `ci.yml`'s
          # destination so the same code that compiles in test CI
          # also compiles under CodeQL's tracer.
          build-mode: manual
          # `security-extended` adds rules beyond the default suite —
          # not as exhaustive as `security-and-quality` but a better
          # signal-to-noise ratio for an app codebase.
          queries: security-extended

      - name: Prepare Ruby toolchain
        # Mirrors `ci.yml`'s pre-build step so the project generator
        # finds the right ruby/xcodeproj.
        run: bash ./.github/scripts/prepare_ruby_toolchain.sh xcodeproj
        shell: bash

      - name: Generate Xcode project
        run: ruby scripts/generate_xcode_project.rb

      - name: Build Swift via xcodebuild (iOS Simulator)
        # VOL-180 Phase 2: explicit iOS-Simulator build so CodeQL
        # traces the same compilation `ci.yml` uses. `xcodebuild
        # build-for-testing` is the minimum that exercises every
        # target's source files (no need to actually run tests
        # under CodeQL — the analyzer just needs to see the compile
        # commands). `-destination 'generic/platform=iOS Simulator'`
        # picks any compatible simulator without binding to a specific
        # device, which makes the workflow resilient to Xcode point
        # updates that churn the per-device simulator IDs.
        run: |
          set -euo pipefail
          xcodebuild build-for-testing \
            -project VolumeArcApple.xcodeproj \
            -scheme VolumeArcApp \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath .build/derived-data-codeql \
            CODE_SIGNING_ALLOWED=NO \
            | xcbeautify --renderer github-actions || true
          # Capture exit even though xcbeautify swallows it. The
          # `set -o pipefail` above + `|| true` on xcbeautify means
          # we keep going if xcbeautify isn't installed; CodeQL's
          # tracer cares about the compile invocations themselves.
        shell: bash

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@v4
        with:
          category: '/language:${{ matrix.language }}'
          # Upload SARIF to the Security tab even on partial failures
          # so we still see the findings the analyzer DID extract.
          upload: always
