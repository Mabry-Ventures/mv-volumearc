name: Trufflehog

# VOL-143: secret-leak detection. Trufflehog scans for credentials,
# API keys, tokens, and other high-entropy strings that look like
# secrets. Catches the canonical "oops I committed an .env" failure
# mode that Dependabot can't see.
#
# Triggers:
# - PRs against main: scan only the diff — fast (<30s) and catches
#   leaks before merge.
# - Push to main: scan the full repo history on every merge. Slower
#   (~2 min on this codebase) but catches a leak that snuck in via
#   a force-push to a feature branch the PR scan didn't see.
# - Weekly cron: re-scan with the latest detector rules.
# - Manual dispatch: ad-hoc.
#
# Trufflehog runtime:
# - The upstream `trufflesecurity/trufflehog@v3` GitHub Action runs
#   inside a Docker container, which our self-hosted Apple Silicon
#   runner doesn't have. We invoke the trufflehog binary directly via
#   Homebrew (pre-installed on the runner; `brew install trufflehog`
#   is documented in `docs/CONTRIBUTING.md` under "Runner maintenance").
# - `--results=verified,unknown` surfaces pre-validation findings too
#   (a key that's been rotated still indicates a process leak).
# - `--no-update` keeps the binary deterministic; the Homebrew formula
#   pin handles version control.
# - The binary is invoked once per scan path; PR scans pass `--since-commit`
#   and `--branch` to scope to the diff, push scans run over the full
#   repo history.

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  schedule:
    - cron: '0 4 * * 0'
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

# VOL-184: shared concurrency group with `ci.yml` and
# `ai-review-gate.yml` to prevent `_actions/` cache races on the
# self-hosted runner. See ci.yml's concurrency block for the full
# rationale. Switching from `cancel-in-progress: true` to `false`
# means rapid retriggers now queue instead of cancel — minor wall-
# clock cost, no more silent stale-SHA failures.
concurrency:
  group: mv-volumearc-actions-${{ github.ref }}
  cancel-in-progress: false

jobs:
  scan:
    name: Scan for leaked secrets
    # VOL-132 fork-PR guard — same posture as ci.yml. Trufflehog itself
    # is safe to run against fork code (read-only), but we don't want to
    # leak the GITHUB_TOKEN scope to fork PRs. Skip on forks; same-repo
    # PRs and main pushes run as normal.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, mv-volumearc-runner]
    timeout-minutes: 10

    steps:
      # VOL-186: the SHA-mismatch detector step (added in VOL-184 as a
      # belt-and-suspenders defense against the `_actions/` cache race)
      # was removed once the post-2026-05-17 fleet `JOB_STARTED` hook
      # took over ghost-SHA workspace detection + auto-wipe at the host
      # level. Workspace SHA integrity is now a host invariant, not a
      # per-workflow defense.
      - name: Checkout
        uses: actions/checkout@v6
        with:
          # Full history on push events so the scan sees every commit.
          # PR events default to a shallow clone covering the diff; we
          # then `git fetch` the base ref so trufflehog's --since-commit
          # has both endpoints locally.
          fetch-depth: ${{ github.event_name == 'pull_request' && 0 || 0 }}

      - name: Verify trufflehog binary
        # The Homebrew formula `trufflehog` should be pre-installed on
        # the mv-volumearc-runner per the runbook in
        # docs/CONTRIBUTING.md "Runner maintenance". This step fails
        # fast with a clear remediation if it isn't, instead of letting
        # the scan step error out with a generic "command not found".
        run: |
          set -euo pipefail
          if ! command -v trufflehog >/dev/null; then
            echo "::error::trufflehog binary not on PATH. Run \`brew install trufflehog\` on the self-hosted runner. See docs/CONTRIBUTING.md."
            exit 1
          fi
          version=$(trufflehog --version 2>&1 | head -1)
          echo "Using $version"

      - name: Scan
        env:
          # The action used to set this automatically; the binary needs
          # an explicit token for higher rate limits on its private-leak
          # lookup. GITHUB_TOKEN is sufficient for repo-scope scans.
          TRUFFLEHOG_GITHUB_TOKEN: ${{ github.token }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail

          # Scope the scan based on event:
          #   - pull_request: --since-commit + --branch limits to the diff
          #   - push / schedule / dispatch: scan the full repo + history
          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            echo "Scanning PR diff: $PR_BASE_SHA..$PR_HEAD_SHA"
            trufflehog git "file://$PWD" \
              --since-commit="$PR_BASE_SHA" \
              --branch="$PR_HEAD_SHA" \
              --results=verified,unknown \
              --no-update \
              --fail
          else
            echo "Scanning entire repo history on $EVENT_NAME"
            trufflehog git "file://$PWD" \
              --results=verified,unknown \
              --no-update \
              --fail
          fi
