name: marketing

on:
  push:
    branches: [main]
    paths:
      - 'marketing/**'
      - '.github/workflows/marketing.yml'
  pull_request:
    paths:
      - 'marketing/**'
      - '.github/workflows/marketing.yml'

# Marketing site CI — Vercel performs the actual preview / production deploys
# via its GitHub App integration; this workflow is the build / typecheck /
# lint gate that protects against red-build Vercel deploys.
#
# VOL-193: fork-PR guard added. Despite the earlier comment claiming
# fork-safety via `pull_request` semantics, this workflow targets the
# privileged `mv-volumearc-runner` macOS host — same host that holds
# Apple Developer signing identity, Keychain, persistent caches, and
# prior-job artifacts. A fork PR touching `marketing/**` carries
# arbitrary code that executes during `npm ci` (postinstall scripts)
# and `next build` on that runner; secret theft is not the only attack
# surface. The guard below skips the job on PRs whose head repo
# differs from the upstream; same-repo PRs and pushes to `main` run as
# normal. Fork contributors should ask a maintainer to push their
# branch into the upstream so CI can execute against trusted code.

permissions:
  contents: read

jobs:
  build:
    name: build + lint + typecheck
    # VOL-193 fork-PR guard — mirrors `ci.yml` `build-and-test` (VOL-132).
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, mv-volumearc-runner]
    timeout-minutes: 15
    defaults:
      run:
        working-directory: marketing
    env:
      # VOL-193: `SHADCNBLOCKS_API_KEY` removed from the PR job env.
      # The key is only needed to *install* new blocks at dev time;
      # `npm run build` does not need it. Keeping the secret out of
      # the PR environment closes a second-order leak path even when
      # the fork guard above is the primary defense.
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: marketing/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Check legal pages (VOL-195)
        # Fails the marketing build if `/terms` or `/privacy` regresses
        # to a placeholder state — Apple Guideline 3.1.2 requires final
        # legal copy at submission, and a future PR could accidentally
        # revert. Scoped to those two routes only.
        run: npm run check:legal

      - name: Build
        # `next build` runs the TypeScript compiler as part of the production
        # build step, so a separate `tsc --noEmit` job would be redundant
        # (and would fail on a fresh checkout because `next build` is what
        # generates `next-env.d.ts`). Run typecheck locally via
        # `npm run typecheck` once you've built once.
        run: npm run build
