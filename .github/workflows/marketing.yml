name: marketing

on:
  push:
    branches: [main]
    paths:
      - 'marketing/**'
      - 'docs/coach-eval-trend.json'
      - '.github/workflows/marketing.yml'
  pull_request:
    paths:
      - 'marketing/**'
      - 'docs/coach-eval-trend.json'
      - '.github/workflows/marketing.yml'

# Marketing site CI — Vercel performs the actual preview / production deploys
# via its GitHub App integration; this workflow is the build / typecheck /
# lint gate that protects against red-build Vercel deploys.
#
# VOL-274: marketing CI is pure Node/Playwright/Lighthouse work and runs
# on GitHub-hosted Linux instead of the scarce Apple signing runner. The
# fork guard remains so unknown branches do not spend CI minutes or run
# arbitrary npm lifecycle scripts unless a maintainer first brings the
# branch into the upstream repo.

permissions:
  contents: read

jobs:
  build:
    name: build + lint + typecheck
    # VOL-193 fork-PR guard — mirrors `ci.yml` `build-and-test` (VOL-132).
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: marketing
    env:
      # VOL-193: `SHADCNBLOCKS_API_KEY` removed from the PR job env.
      # The key is only needed to *install* new blocks at dev time;
      # `npm run build` does not need it. Keeping the secret out of
      # the PR environment closes a second-order leak path even when
      # the fork guard above is the primary defense.
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: marketing/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: npm audit (VOL-254)
        # VolumeArc Release: dependency audit is now a hard gate. The
        # prior observation window is over and the Lighthouse transitive
        # `tmp` advisory is resolved through the lockfile override, so
        # moderate-or-higher findings must block until fixed or accepted.
        env:
          NPM_AUDIT_LEVEL: moderate
        run: |
          set -euo pipefail
          npm audit --audit-level="$NPM_AUDIT_LEVEL"

      - name: Lint
        run: npm run lint

      - name: Check legal pages (VOL-195)
        # Fails the marketing build if `/terms` or `/privacy` regresses
        # to a placeholder state — Apple Guideline 3.1.2 requires final
        # legal copy at submission, and a future PR could accidentally
        # revert. Scoped to those two routes only.
        run: npm run check:legal

      - name: Build
        # `next build` runs the TypeScript compiler as part of the production
        # build step, so a separate `tsc --noEmit` job would be redundant
        # (and would fail on a fresh checkout because `next build` is what
        # generates `next-env.d.ts`). Run typecheck locally via
        # `npm run typecheck` once you've built once.
        run: npm run build

      - name: Generate SBOM (VOL-254)
        # VolumeArc Release: CycloneDX SBOM generation is a hard
        # supply-chain gate. `npm sbom` is built into npm 10.5+
        # (Node 22 ships 10.x); the artifact lets security review diff
        # composition release-over-release.
        run: npm sbom --sbom-format=cyclonedx > marketing-sbom.cyclonedx.json

      - name: Upload SBOM artifact (VOL-254)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: marketing-sbom-${{ github.run_id }}
          path: marketing/marketing-sbom.cyclonedx.json
          retention-days: 90
          if-no-files-found: warn

      - name: Check links (VOL-217 Phase 1)
        # Static link guard: walks `.next/server/app/**/*.html` from the
        # build above and fails on any `href="#"` (dead CTA — App Store
        # badge regression class, see VOL-208) or any internal `href`
        # that doesn't resolve to a known route. Pure Node, no browser,
        # ~1s. Phase 2 (Playwright + axe + Lighthouse) will follow in
        # a separate ticket.
        run: npm run check:links

      # VOL-217 P2: pin the Playwright browser cache inside the job
      # workspace so browser installs are per-checkout and cannot leak
      # across jobs.
      - name: Run Playwright smoke
        timeout-minutes: 10
        env:
          PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/.playwright
        run: |
          npx playwright install chromium
          npm run test:e2e

      - name: Run accessibility scan
        timeout-minutes: 10
        env:
          PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/.playwright
        run: npm run test:a11y

      - name: Run Lighthouse CI
        timeout-minutes: 10
        # VOL-229: `marketing/scripts/run-lighthouse.mjs` resolves
        # Chrome via Playwright's `chromium.executablePath()`. The
        # Playwright install above pinned the browser cache to
        # `${{ github.workspace }}/.playwright` (per VOL-217 P2 to
        # avoid EPERM on the shared runner home dir). Without the
        # same `PLAYWRIGHT_BROWSERS_PATH` here, the script's
        # `chromium.executablePath()` returns a default-but-empty
        # path and Lighthouse fails with `No Chrome installations
        # found`.
        env:
          PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/.playwright
        run: npm run test:lighthouse
