name: AI Review Gate

on:
  pull_request_target:
    types: [opened, reopened, synchronize, ready_for_review]
  issue_comment:
    types: [created, edited]
  pull_request_review:
    types: [submitted, edited, dismissed]
  pull_request_review_comment:
    types: [created, edited]

permissions:
  contents: read
  pull-requests: write
  issues: write

# VOL-184/VOL-192: workflow-specific concurrency group. See ci.yml's
# concurrency block for the full rationale — sharing the group across
# ci/trufflehog/ai-review-gate caused gate-cascade cancellations of
# in-flight CI runs (VOL-192). The gate is the workflow most prone to
# bot-event cascades, so keeping its group separate stops it from
# tail-pulling CI/Trufflehog. `cancel-in-progress: false` lets the
# bots' rapid events queue rather than cancel mid-flight.
concurrency:
  group: ai-review-gate-${{ github.ref }}
  cancel-in-progress: false

jobs:
  request-ai-reviews:
    name: Request AI Reviews
    if: github.event_name == 'pull_request_target' && !github.event.pull_request.draft
    runs-on: [self-hosted, mv-volumearc-runner]
    steps:
      - name: Request AI reviews for current head SHA
        uses: actions/github-script@v9
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const issue_number = context.payload.pull_request.number;
            const sha = context.payload.pull_request.head.sha;

            const comments = await github.paginate(github.rest.issues.listComments, {
              owner,
              repo,
              issue_number,
              per_page: 100,
            });

            const ensureComment = async (marker, body) => {
              const exists = comments.some((comment) =>
                typeof comment.body === 'string' && comment.body.includes(marker)
              );
              if (!exists) {
                await github.rest.issues.createComment({ owner, repo, issue_number, body });
              }
            };

            await ensureComment(
              `<!-- codex-review-request:${sha} -->`,
              `<!-- codex-review-request:${sha} -->\n@codex review`
            );
            await ensureComment(
              `<!-- coderabbit-review-request:${sha} -->`,
              `<!-- coderabbit-review-request:${sha} -->\n@coderabbitai review`
            );

  ai-review:
    name: ${{ matrix.ai_name }} Code Review
    if: >-
      github.event_name == 'pull_request_target' ||
      github.event_name == 'issue_comment' ||
      github.event_name == 'pull_request_review' ||
      github.event_name == 'pull_request_review_comment'
    runs-on: [self-hosted, mv-volumearc-runner]
    strategy:
      fail-fast: false
      matrix:
        include:
          - ai_name: Codex
            ai_logins: '["codex","chatgpt-codex-connector[bot]"]'
            request_marker: codex-review-request
            wait_minutes: '15'
          - ai_name: CodeRabbit
            ai_logins: '["coderabbitai[bot]","coderabbitai"]'
            request_marker: coderabbit-review-request
            wait_minutes: '20'
    steps:
      - name: Wait for ${{ matrix.ai_name }} review signal
        uses: actions/github-script@v9
        env:
          AI_LOGINS: ${{ matrix.ai_logins }}
          AI_NAME: ${{ matrix.ai_name }}
          REQUEST_MARKER: ${{ matrix.request_marker }}
          WAIT_MINUTES: ${{ matrix.wait_minutes }}
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const botLogins = JSON.parse(process.env.AI_LOGINS);
            const aiName = process.env.AI_NAME || 'AI';
            const requestMarker = process.env.REQUEST_MARKER || '';
            const waitMinutes = Number(process.env.WAIT_MINUTES || '15');
            const delayMs = 30000;
            const deadline = Date.now() + waitMinutes * 60 * 1000;

            async function sleep(ms) {
              await new Promise((resolve) => setTimeout(resolve, ms));
            }

            async function getPullNumber() {
              if (context.payload.pull_request?.number) return context.payload.pull_request.number;
              if (context.payload.issue?.pull_request) return context.payload.issue.number;
              if (context.payload.review?.pull_request_url) {
                return Number(context.payload.review.pull_request_url.split('/').pop());
              }
              if (context.payload.comment?.pull_request_review_id && context.payload.pull_request?.number) {
                return context.payload.pull_request.number;
              }
              core.setFailed(`Unable to determine pull request number for ${aiName} review gate.`);
              return null;
            }

            function bodyText(value) {
              return String(value || '')
                .replace(/<!--[\s\S]*?-->/g, '')
                .replace(/<[^>]+>/g, '\n')
                .replace(/\r\n/g, '\n')
                .replace(/&nbsp;/g, ' ')
                .trim();
            }

            function nonReviewReason(candidate) {
              const text = bodyText(candidate.body);
              const compact = text.replace(/\s+/g, ' ').trim();

              if (
                /Codex usage limits have been reached/i.test(text) ||
                /Review limit reached/i.test(text) ||
                /rate limited by coderabbit\.ai/i.test(text) ||
                /couldn't start this review/i.test(text) ||
                /organization has run out of usage credits/i.test(text) ||
                /used your available PR reviews/i.test(text)
              ) {
                return `${aiName} skipped review: rate-limit notice is not a review signal`;
              }

              if (
                /Review triggered\./i.test(text) &&
                !/\b(review findings|finding|issue|suggestion|nitpick|walkthrough|summary)\b/i.test(text.replace(/Review triggered\./ig, ''))
              ) {
                return `${aiName} skipped review: trigger acknowledgement is not a review signal`;
              }

              if (
                /(^|\n)\s*(?:✅\s*)?#{0,6}\s*Actions performed\b/i.test(text) &&
                !/(^|\n)\s*#{1,6}\s+(?!Actions performed\b)/im.test(text.replace(/(^|\n)\s*(?:✅\s*)?#{0,6}\s*Actions performed\b[^\n]*/i, '\n'))
              ) {
                return `${aiName} skipped review: actions-only automation comment is not a review signal`;
              }

              return null;
            }

            function candidateTime(candidate) {
              return new Date(candidate.createdAt).getTime();
            }

            function candidateLabel(candidate) {
              return `${candidate.kind} from ${candidate.login} at ${candidate.createdAt}`;
            }

            async function hasSignal(prNumber) {
              const { data: pr } = await github.rest.pulls.get({ owner, repo, pull_number: prNumber });
              if (pr.draft) return { ok: true, reason: 'Draft PR, skipping until ready for review.' };

              const headSha = pr.head.sha;
              const { data: commit } = await github.rest.repos.getCommit({ owner, repo, ref: headSha });
              const baseline = new Date(
                commit.commit.committer?.date ||
                commit.commit.author?.date ||
                pr.updated_at
              );

              const reviews = await github.paginate(github.rest.pulls.listReviews, {
                owner,
                repo,
                pull_number: prNumber,
                per_page: 100,
              });

              const issueComments = await github.paginate(github.rest.issues.listComments, {
                owner,
                repo,
                issue_number: prNumber,
                per_page: 100,
              });

              const reviewComments = await github.paginate(github.rest.pulls.listReviewComments, {
                owner,
                repo,
                pull_number: prNumber,
                per_page: 100,
              });

              const matches = (login) => botLogins.includes(login || '');
              const isFresh = (value) => value && new Date(value) >= baseline;

              const candidates = [];

              for (const item of reviews) {
                if (matches(item.user?.login) && (item.commit_id === headSha || isFresh(item.submitted_at))) {
                  candidates.push({
                    kind: 'review',
                    login: item.user.login,
                    createdAt: item.submitted_at,
                    body: item.body,
                  });
                }
              }

              for (const item of issueComments) {
                if (matches(item.user?.login) && isFresh(item.created_at)) {
                  candidates.push({
                    kind: 'issue comment',
                    login: item.user.login,
                    createdAt: item.created_at,
                    body: item.body,
                  });
                }
              }

              for (const item of reviewComments) {
                if (matches(item.user?.login) && (item.commit_id === headSha || isFresh(item.created_at))) {
                  candidates.push({
                    kind: 'review comment',
                    login: item.user.login,
                    createdAt: item.created_at,
                    body: item.body,
                  });
                }
              }

              const marker = `<!-- ${requestMarker}:${headSha} -->`;
              const requestComments = issueComments.filter((item) =>
                requestMarker && typeof item.body === 'string' && item.body.includes(marker)
              );
              for (const item of requestComments) {
                const reactions = await github.paginate(github.rest.reactions.listForIssueComment, {
                  owner,
                  repo,
                  comment_id: item.id,
                  per_page: 100,
                });
                const reaction = reactions.find((entry) =>
                  entry.content === '+1' && matches(entry.user?.login) && isFresh(entry.created_at)
                );
                if (reaction) {
                  candidates.push({
                    kind: '+1 reaction',
                    login: reaction.user.login,
                    createdAt: reaction.created_at,
                    body: '+1',
                  });
                }
              }

              candidates.sort((left, right) => candidateTime(right) - candidateTime(left));

              const accepted = candidates.find((candidate) => !nonReviewReason(candidate));
              if (accepted) {
                return { ok: true, reason: candidateLabel(accepted) };
              }

              if (candidates.length > 0) {
                const latest = candidates[0];
                const reason = nonReviewReason(latest) || `${aiName} bot activity was not accepted as a review signal`;
                return {
                  ok: false,
                  reason: `${reason}; latest bot activity was ${candidateLabel(latest)} for head ${headSha.slice(0, 7)}`,
                };
              }

              return {
                ok: false,
                reason: `No fresh ${aiName} review signal yet for head ${headSha.slice(0, 7)} after ${baseline.toISOString()}`,
              };
            }

            const prNumber = await getPullNumber();
            if (!prNumber) return;

            let lastReason = `No ${aiName} signal observed yet.`;
            while (Date.now() < deadline) {
              const result = await hasSignal(prNumber);
              if (result.ok) {
                core.info(result.reason);
                return;
              }
              lastReason = result.reason;
              core.info(lastReason);
              await sleep(delayMs);
            }

            core.setFailed(`${lastReason}. Timed out waiting for ${aiName} review.`);
