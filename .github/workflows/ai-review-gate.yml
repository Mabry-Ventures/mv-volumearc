name: AI Review Gate

# One read-only evaluation per event. Missing review evidence fails closed;
# review events and explicit reruns reconcile it without polling or bot nudges.
# Hosted providers own PR-open admission; request final-head rereviews once.

on:
  workflow_dispatch:
    inputs:
      pr_number:
        description: Exact-head PR to evaluate once using this reviewed branch
        required: true
        type: string
  pull_request_target:
    types: [opened, reopened, synchronize, ready_for_review]
  issue_comment:
    types: [created, edited]
  pull_request_review:
    types: [submitted, edited, dismissed]
  pull_request_review_comment:
    types: [created, edited]

permissions:
  contents: read
  pull-requests: read
  issues: read

concurrency:
  group: ai-review-gate-${{ github.event.pull_request.number || github.event.issue.number || github.run_id }}
  cancel-in-progress: false

jobs:
  # Gate any write-scoped step on the PR being from the repo itself, not a fork.
  # `pull_request_target` runs against the base branch with write access; without
  # this guard a fork PR could spoof review signals by posting comments with the
  # expected markers.
  check-trusted:
    name: Check PR Provenance
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    outputs:
      is_trusted: ${{ steps.trust.outputs.is_trusted }}
    steps:
      - name: Determine fork vs repo PR
        id: trust
        uses: actions/github-script@v9
        with:
          script: |
            const event = context.eventName;
            if (event !== 'pull_request_target') {
              core.setOutput('is_trusted', 'true');
              return;
            }
            const headRepo = context.payload.pull_request?.head?.repo?.full_name;
            const baseRepo = context.payload.repository?.full_name;
            const trusted = headRepo === baseRepo;
            core.info(`head=${headRepo} base=${baseRepo} trusted=${trusted}`);
            core.setOutput('is_trusted', trusted ? 'true' : 'false');


  codex-review:
    name: Codex Code Review
    needs: check-trusted
    if: |
      needs.check-trusted.outputs.is_trusted == 'true' &&
      (github.event_name == 'workflow_dispatch' ||
       github.event_name == 'pull_request_target' ||
       github.event_name == 'issue_comment' ||
       github.event_name == 'pull_request_review' ||
       github.event_name == 'pull_request_review_comment')
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - name: Evaluate Codex review signal
        uses: actions/github-script@v9
        env:
          AI_LOGINS: '["codex","chatgpt-codex-connector[bot]"]'
          AI_NAME: Codex
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const botLogins = JSON.parse(process.env.AI_LOGINS);
            const aiName = process.env.AI_NAME || 'AI';


            const getPullNumber = () => {
              if (context.eventName === 'workflow_dispatch') {
                const n = Number(context.payload.inputs?.pr_number);
                if (Number.isSafeInteger(n) && n > 0) return n;
                core.setFailed('A positive PR number is required.');
                return null;
              }
              if (context.payload.pull_request?.number) return context.payload.pull_request.number;
              if (context.payload.issue?.pull_request) return context.payload.issue.number;
              if (context.payload.review?.pull_request_url) {
                return Number(context.payload.review.pull_request_url.split('/').pop());
              }
              if (context.payload.comment?.pull_request_review_id && context.payload.pull_request?.number) {
                return context.payload.pull_request.number;
              }
              core.setFailed(`Unable to determine pull request number for ${aiName} review gate.`);
              return null;
            };

            const unavailable = (body) => /^(?:You have reached your Codex usage limits(?: for code reviews)?[.!]|Codex usage limits have been reached for code reviews[.!]|Code review (?:quota|credits) (?:has been |have been )?exhausted[.!]|Review was not performed because (?:the )?(?:quota|rate limit) (?:was |has been )?exceeded[.!])/i.test(body || '');
            const knownCommentedBody = "### \ud83d\udca1 Codex Review Here are some automated review suggestions for this pull request. **Reviewed commit:** `<commit>` <details> <summary>\u2139\ufe0f About Codex in GitHub</summary> <br/> [Your team has set up Codex to review pull requests in this repo](https://chatgpt.com/codex/cloud/settings/general). Reviews are triggered when you - Open a pull request for review - Mark a draft as ready - Comment \"@codex review\". If Codex has suggestions, it will comment; otherwise it will react with \ud83d\udc4d. Codex can also answer questions or update the PR. Try commenting \"@codex address that feedback\". </details>";
            const standardCommentedReview = (body) => String(body || '')
              .replace(/(\*\*Reviewed commit:\*\*\s*`)[0-9a-f]{7,40}(`)/gi, '$1<commit>$2')
              .replace(/\s+/g, ' ').trim() === knownCommentedBody;
            const hasSignal = async (prNumber) => {
              const { data: pr } = await github.rest.pulls.get({ owner, repo, pull_number: prNumber });
              if (context.eventName === 'workflow_dispatch' &&
                  (pr.head.sha !== context.sha || pr.head.repo.full_name !== `${owner}/${repo}`)) {
                return { ok: false, reason: 'Manual admission must run the exact same-repository PR head.' };
              }
              if (pr.draft) return { ok: true, reason: 'Draft PR; skipping until ready for review.' };

              const headSha = pr.head.sha;
              const { data: commit } = await github.rest.repos.getCommit({ owner, repo, ref: headSha });
              const baseline = new Date(
                commit.commit.committer?.date || commit.commit.author?.date || pr.updated_at
              );
              const normalized = (login) => String(login || '').toLowerCase().replace(/\[bot\]$/, '');
              const matches = (login) => botLogins.some((trusted) => normalized(trusted) === normalized(login));
              const isFresh = (v) => v && new Date(v) >= baseline;

              const [reviews, issueComments, reviewComments] = await Promise.all([
                github.paginate(github.rest.pulls.listReviews, { owner, repo, pull_number: prNumber, per_page: 100 }),
                github.paginate(github.rest.issues.listComments, { owner, repo, issue_number: prNumber, per_page: 100 }),
                github.paginate(github.rest.pulls.listReviewComments, { owner, repo, pull_number: prNumber, per_page: 100 }),
              ]);

              const current = reviews.filter((x) => x.user?.type === 'Bot' && matches(x.user?.login) && x.commit_id === headSha)
                .sort((a, b) => new Date(b.submitted_at).getTime() - new Date(a.submitted_at).getTime());
              const latest = current[0];
              if (latest && (!Number.isFinite(new Date(latest.submitted_at).getTime()) ||
                  !['APPROVED', 'COMMENTED'].includes(latest.state) || unavailable(latest.body) ||
                  (latest.state === 'COMMENTED' && !standardCommentedReview(latest.body)) ||
                  (latest.state === 'COMMENTED' && !headSha.startsWith(String(latest.body || '').match(/Reviewed commit:\*{0,2}\s*`?([0-9a-f]{7,40})/i)?.[1]?.toLowerCase() || 'no-reviewed-commit')))) {
                return { ok: false, reason: 'Latest exact-head primary review is blocking or unavailable.' };
              }
              if (latest) {
                let after = null;
                for (let page = 0; page < 20; page++) {
                  const data = await github.graphql(`query($owner:String!,$repo:String!,$number:Int!,$after:String){
                    repository(owner:$owner,name:$repo){pullRequest(number:$number){headRefOid
                      reviewThreads(first:100,after:$after){pageInfo{hasNextPage endCursor} nodes{isResolved comments(first:1){nodes{author{__typename login}}}}}
                    }}}`, { owner, repo, number: prNumber, after });
                  const live = data.repository?.pullRequest;
                  const threads = live?.reviewThreads;
                  if (live?.headRefOid !== headSha || !Array.isArray(threads?.nodes) || typeof threads.pageInfo?.hasNextPage !== 'boolean' ||
                      threads.nodes.some((t) => !t.isResolved && t.comments.nodes.some((c) => c.author?.__typename === 'Bot' && matches(c.author?.login)))) {
                    return { ok: false, reason: 'Primary review conversations are unresolved, incomplete, or stale.' };
                  }
                  if (!threads.pageInfo.hasNextPage) break;
                  if (page === 19 || !threads.pageInfo.endCursor || threads.pageInfo.endCursor === after) {
                    return { ok: false, reason: 'Review conversation pagination exceeded its bounded limit or returned an invalid cursor.' };
                  }
                  after = threads.pageInfo.endCursor;
                }
                return { ok: true, reason: `Current primary review from ${latest.user.login} has no unresolved primary conversations.` };
              }

              return { ok: false, reason: `No fresh ${aiName} signal for head ${headSha.slice(0, 7)} after ${baseline.toISOString()}` };
            };

            const prNumber = getPullNumber();
            if (!prNumber) return;

            const result = await hasSignal(prNumber);
            if (result.ok) { core.info(result.reason); return; }
            core.setFailed(`${result.reason}. Review is pending or unavailable. A review event or explicit rerun reevaluates this head without occupying a runner while waiting.`);
