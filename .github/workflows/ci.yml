name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # VOL-75: self-hosted runners launched by launchctl before the Homebrew
  # PATH ever reached them have a minimal env, so `swiftlint`, the modern
  # Ruby from Homebrew, and user-gem bin directories are all missing from
  # PATH at step-invocation time. Prepending them here makes the workflow
  # insensitive to shell-profile timing on the runner.
  PATH: /opt/homebrew/opt/ruby/bin:/opt/homebrew/lib/ruby/gems/4.0.0/bin:/Users/githubrunner/.gem/ruby/4.0.0/bin:/opt/homebrew/bin:/opt/homebrew/sbin:/usr/local/bin:/usr/bin:/bin:/usr/sbin:/sbin

jobs:
  build-and-test:
    name: Build & Test
    runs-on: [self-hosted, mv-shared]
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Pre-flight
        # VOL-75: fail fast if the runner is missing something required.
        # Cheaper than a 20-minute build that dies at step 6 on a sick runner.
        run: |
          set -euo pipefail
          echo "PATH=$PATH"
          xcodebuild -version
          ruby --version | grep -qE 'ruby (3|4)\.' || { echo "::error::Ruby < 3.0 (EOL)"; exit 1; }
          gem list xcodeproj --installed --version '>= 1.0' >/dev/null || { echo "::error::xcodeproj gem missing"; exit 1; }
          command -v swiftlint >/dev/null || { echo "::error::swiftlint missing on runner"; exit 1; }
          # Absolute-available is more meaningful than percent on shared
          # runner Macs with big drives; iOS build+test needs ~5GB headroom.
          avail_gb=$(df -g "$HOME" | awk 'NR==2 {print $4}')
          if [ "${avail_gb:-0}" -lt 10 ]; then
            echo "::error::Disk has only ${avail_gb}GB available (need >=10GB)"
            exit 1
          fi
          echo "Disk avail: ${avail_gb}GB"
          echo "Pre-flight OK"
        shell: bash

      - name: Generate Xcode project
        run: ruby scripts/generate_xcode_project.rb

      - name: Clear stale system DerivedData
        # Belt-and-suspenders: scripts now use per-job DerivedData via
        # -derivedDataPath (VOL-75 P2 / PR #42), so stale system-level
        # DerivedData shouldn't matter. Keeping this to clean up any legacy
        # directories left from pre-#42 runs, and as a safety net in case a
        # developer running the script locally mixes configurations.
        run: |
          set -euo pipefail
          shopt -s nullglob
          stale_dirs=("$HOME/Library/Developer/Xcode/DerivedData"/VolumeArcApple-*)
          if [ ${#stale_dirs[@]} -gt 0 ]; then
            rm -rf "${stale_dirs[@]}"
            echo "Cleared ${#stale_dirs[@]} legacy DerivedData directory(ies)."
          else
            echo "No legacy VolumeArcApple-* DerivedData to clear."
          fi
        shell: bash

      - name: Build all targets (Debug)
        run: ./scripts/build_all_targets.sh

      - name: Run tests
        run: ./scripts/test_apple_targets.sh

      - name: Lint (SwiftLint)
        # VOL-77: hard-fail on actual SwiftLint errors (rules that exceed
        # their configured `error:` threshold). Warnings still surface in
        # the CI log for reviewer visibility, but don't block merge —
        # running with `--strict` would upgrade every warning to a hard
        # fail, which flagged ~20 pre-existing length violations on the
        # first run. Tracked separately for progressive tightening so we
        # don't burn this PR on an unrelated cleanup.
        #
        # Pre-flight above asserts the binary is on PATH, so we always
        # lint — no silent skip.
        run: swiftlint lint

      - name: Validate release configuration
        run: ./scripts/validate_release_config.sh

  deploy-testflight:
    name: Deploy to TestFlight
    needs: build-and-test
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: [self-hosted, mv-shared]
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Install dependencies
        run: bundle install

      - name: Deploy to TestFlight
        env:
          DEVELOPMENT_TEAM: ${{ secrets.DEVELOPMENT_TEAM }}
          APP_STORE_CONNECT_API_KEY_PATH: ${{ secrets.APP_STORE_CONNECT_API_KEY_PATH }}
          # VOL-76 remainder: set so validate_release_config.sh hard-fails
          # (not just warns) when VERSION matches the latest tag on a tag build.
          CI_TAG_BUILD: '1'
        run: bundle exec fastlane ios beta
