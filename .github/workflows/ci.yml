name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - codex/**

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Unit Tests
        run: npm test -- --runInBand

      - name: Build
        run: npm run build

      - name: AI Eval Gate
        run: npm run ai:eval

  visual-regression:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Build
        run: npm run build

      - name: Visual Diff Gate
        run: |
          npm run start -- --hostname 127.0.0.1 --port 4173 &
          APP_PID=$!
          trap "kill $APP_PID" EXIT
          for i in {1..60}; do
            if curl -sS http://127.0.0.1:4173 >/dev/null; then
              break
            fi
            sleep 1
          done
          curl -sS http://127.0.0.1:4173 >/dev/null
          npm run visual:ci

      - name: Upload visual diffs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: visual-diff-artifacts
          path: output/playwright/visual-diff
