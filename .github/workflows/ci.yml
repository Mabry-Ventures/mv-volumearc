name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

# VOL-184/VOL-192: workflow-specific concurrency group. The original
# VOL-184 fix shared `mv-volumearc-actions-${{ github.ref }}` across
# ci/trufflehog/ai-review-gate to prevent the `_actions/` cache race,
# but VOL-192 surfaced a new failure: bot-driven rapid `pull_request_review`
# events spawn back-to-back gate runs, each of which (per GH concurrency
# semantics) cancels the previously-pending CI run in the same group —
# even with `cancel-in-progress: false`. The 2026-05-17 fleet
# `JOB_STARTED` ghost-SHA hook (VOL-186) handles the workspace state
# at the host level, so the original cache-race protection is no
# longer required. Each workflow now gets its own per-ref group with
# `cancel-in-progress: false`.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: false

env:
  # VOL-88: the current GitHub runner inventory exposes the dedicated
  # Apple Silicon machine with the `mv-shared` label. Keep only portable
  # base tool locations here; prepare_ruby_toolchain.sh appends Ruby and
  # gem bins dynamically via GITHUB_PATH after detecting the runner image.
  PATH: /opt/homebrew/bin:/opt/homebrew/sbin:/usr/local/bin:/usr/bin:/bin:/usr/sbin:/sbin
  # VOL-126: fastlane on Ruby 4.x crashes with
  # `String#encode: "Cr" on UTF-16 (Encoding::InvalidByteSequenceError)`
  # when xcodebuild output contains non-ASCII bytes (Apple's © branding,
  # accented marketing strings, etc.) and the runner's locale isn't set
  # to UTF-8. The deploy-testflight job hits this on `xcodebuild
  # -showBuildSettings` inside `Gym::DetectValues.detect_platform`.
  # Pinning LANG/LC_ALL to en_US.UTF-8 makes Ruby and fastlane consistently
  # treat output as UTF-8 instead of falling back to ASCII / mis-detecting
  # as UTF-16. Affects every job since the env block is workflow-wide; no
  # downside on macOS runners (en_US.UTF-8 is always present).
  LANG: en_US.UTF-8
  LC_ALL: en_US.UTF-8

jobs:
  build-and-test:
    name: Build & Test
    # VOL-132: fork-PR guard. The `mv-shared` self-hosted runner is a
    # privileged macOS host (Apple Developer signing identity, Keychain,
    # decoded SSH key for git operations, persistent DerivedData / SPM
    # cache, prior-job artifacts). A fork PR carries arbitrary code from a
    # contributor outside the upstream repo; allowing it to execute on
    # `mv-shared` would let that code read or modify any of the above.
    # This guard skips the job on PRs whose head repository differs from
    # the upstream — push events (main + tags) and same-repo PRs run as
    # normal. Fork contributors should ask a maintainer to push their
    # branch into the upstream so CI can execute against trusted code.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, mv-volumearc-runner]
    # VOL-88 / VOL-111 / VOL-112: self-hosted macOS runners may start
    # with no warm DerivedData / SPM cache, so a cold first run can spend
    # a long time compiling Sentry's Swift dependencies and all simulator
    # targets from source before the app's own tests execute.
    #
    # PR #88 proved 90 min is still too tight on a cold runner: build-all
    # completed after ~68 min, unit tests passed, then the job was canceled
    # while the UI test target was still building/running. 150 min gives
    # full build + unit/UI tests + coverage/lint/release validation enough
    # headroom while cache work lands.
    # A future follow-up (snapshot caching of DerivedData into the runner
    # image) would let us drop this back down.
    timeout-minutes: 150
    # VOL-97: the post-merge coverage-trend append step commits back to
    # main, so the job-scoped GITHUB_TOKEN needs write access to
    # repository contents. PR jobs don't commit; the same permission is
    # harmless there because branch protection on main + the
    # `if: github.event_name == 'push'` guard on the append step are
    # what actually gate the write. `pull-requests: write` lets the
    # sticky PR comment step create/update the coverage comment via
    # actions/github-script.
    permissions:
      contents: write
      pull-requests: write

    steps:
      # VOL-103: `continue-on-error: true` covers both the main checkout
      # and the auto-injected Post Checkout cleanup. The cleanup step
      # races against the runner's `_actions/` cache and fails with
      # "Can't find action.yml under actions/checkout/v6" when another
      # job interferes. Letting it fail the job would mask successful
      # test + coverage runs.
      #
      # VOL-186 / VOL-194: the per-workflow SHA-mismatch detector was
      # removed in VOL-186 in favor of the post-2026-05-17 fleet
      # `JOB_STARTED` hook doing ghost-SHA detection at the host level.
      # The 2026-05-18 audit (F-C-002) flagged the resulting fail-open
      # posture: a required status check that does not prove it tested
      # the PR SHA is not an enforceable gate, regardless of host-level
      # defenses. This restores the explicit per-workflow assertion as
      # belt-and-suspenders defense — the host hook remains the primary
      # auto-recovery mechanism, but a non-matching workspace SHA after
      # checkout now fails the job immediately rather than running
      # tests against a stale tree and reporting green.
      - name: Checkout
        continue-on-error: true
        uses: actions/checkout@v6

      - name: Verify checkout SHA matches GITHUB_SHA (VOL-194)
        # If `actions/checkout` failed because of the `_actions/` cache
        # race, this step re-evaluates the existing workspace HEAD.
        # When the host-level JOB_STARTED hook has already cleaned a
        # ghost-SHA workspace, this passes against the freshly-checked
        # tree. When checkout silently failed against a stale workspace
        # that the host hook did NOT catch, this is the gate that fails
        # the job before the build/test steps can report green against
        # the wrong source tree. Tolerates the documented set of
        # generated, gitignored outputs that the prepare/preflight
        # steps regenerate (DerivedData paths, transient build caches).
        run: |
          set -euo pipefail
          actual_sha="$(/usr/bin/git rev-parse HEAD)"
          expected_sha="${GITHUB_SHA}"
          if [[ "${actual_sha}" != "${expected_sha}" ]]; then
            echo "::error::Workspace HEAD ${actual_sha} does not match GITHUB_SHA ${expected_sha}. Checkout did not produce a workspace at the PR/push SHA; refusing to run the required Build & Test step against an unverified tree. The host-level JOB_STARTED hook should have caught this — investigate the runner's _actions/ cache state."
            exit 1
          fi
          # Tolerate the well-known transient outputs the runner produces
          # before this step (none expected at this point, but keep the
          # tolerance explicit so future generated paths don't trip a
          # false positive).
          dirty="$(/usr/bin/git status --porcelain=v1 || true)"
          if [[ -n "${dirty}" ]]; then
            echo "::warning::Workspace has uncommitted changes after checkout:"
            echo "${dirty}"
            # Not a hard fail — `actions/checkout@v6` does not guarantee
            # a clean workspace on the self-hosted runner because the
            # _actions/ cache lives next to it. We surface it so a real
            # regression (e.g. a generated file accidentally checked in)
            # is debuggable.
          fi
          echo "Workspace SHA matches GITHUB_SHA (${expected_sha})"
        shell: bash

      - name: Prepare Ruby toolchain
        # VOL-109/VOL-110 PR unblock: runner images may have
        # Homebrew on PATH without the ruby formula installed/linked, which
        # leaves `ruby` resolving to macOS' EOL system Ruby despite the static
        # PATH above. Bootstrap the Homebrew Ruby explicitly and publish the
        # actual Ruby + gem bin dirs to following steps.
        run: bash ./.github/scripts/prepare_ruby_toolchain.sh xcodeproj
        shell: bash

      - name: Pre-flight
        # VOL-75: fail fast if the runner is missing something required.
        # Cheaper than a 20-minute build that dies at step 6 on a sick runner.
        run: |
          set -euo pipefail
          echo "PATH=$PATH"
          xcode_version_output=$(xcodebuild -version)
          printf '%s\n' "$xcode_version_output"
          ruby --version | grep -qE 'ruby (3|4)\.' || { echo "::error::Ruby < 3.0 (EOL)"; exit 1; }
          # VOL-151: warn (don't fail) when the runner's Ruby diverges from
          # `.ruby-version`. We can't `brew install ruby@N` reliably across
          # Homebrew versions, so the pin is advisory until the toolchain
          # bootstrap is migrated to bundler. The warning catches Homebrew
          # bumps that change behavior so we can update the pin deliberately.
          if [[ -f .ruby-version ]]; then
            expected_ruby=$(tr -d '[:space:]' < .ruby-version)
            actual_ruby=$(ruby --version | awk '{print $2}' | cut -d'.' -f1-2)
            if [[ "$expected_ruby" != "$actual_ruby"* && "$actual_ruby" != "$expected_ruby"* ]]; then
              echo "::warning::Ruby version drift: .ruby-version=$expected_ruby, runner=$actual_ruby"
            fi
          fi
          gem list xcodeproj --installed --version '>= 1.0' >/dev/null || { echo "::error::xcodeproj gem missing"; exit 1; }
          command -v swiftlint >/dev/null || { echo "::error::swiftlint missing on runner"; exit 1; }
          # VOL-151: SwiftLint version assertion. The lint config in
          # `.swiftlint.yml` was tuned against a specific minor; new minors
          # can introduce rule renames or default changes that break --strict
          # silently. Assert ≥ 0.62 (where the rules our config uses
          # stabilized) and warn on a major bump (1.x will likely require
          # rule audits).
          swiftlint_version="$(swiftlint version 2>/dev/null | head -n1 | awk '{print $NF}')"
          swiftlint_major=$(printf '%s\n' "$swiftlint_version" | cut -d'.' -f1)
          swiftlint_minor=$(printf '%s\n' "$swiftlint_version" | cut -d'.' -f2)
          if [[ "$swiftlint_major" -eq 0 && "$swiftlint_minor" -lt 62 ]]; then
            echo "::error::SwiftLint $swiftlint_version is below the 0.62 floor (rule config tuned against ≥ 0.62)"
            exit 1
          fi
          if [[ "$swiftlint_major" -ge 1 ]]; then
            echo "::warning::SwiftLint $swiftlint_version is on a 1.x major; rule config may need a re-audit"
          fi
          echo "Toolchain: ruby=$(ruby --version | awk '{print $2}') xcodeproj=$(gem list xcodeproj --installed --details 2>/dev/null | head -n1) swiftlint=$swiftlint_version"
          # Toolchain pin: Xcode 26.4+ is required so the Swift 6.3 language
          # mode and the iOS 26 SDK that build settings depend on are
          # available. `xcodebuild -version` prints e.g. "Xcode 26.4" on the
          # first line; parse the version components and compare against the
          # required minimum. If the runner's Xcode is older the build would
          # fail later with a confusing "unsupported Swift compiler version"
          # — fail here with a precise message instead.
          xcode_version_line=$(printf '%s\n' "$xcode_version_output" | awk 'NR==1 {print $2}')
          xcode_major=$(echo "$xcode_version_line" | awk -F. '{print $1}')
          xcode_minor=$(echo "$xcode_version_line" | awk -F. '{print $2+0}')
          required_major=26
          required_minor=4
          if [ "${xcode_major:-0}" -lt "$required_major" ] \
             || { [ "${xcode_major:-0}" -eq "$required_major" ] \
                  && [ "${xcode_minor:-0}" -lt "$required_minor" ]; }; then
            echo "::error::Xcode $xcode_version_line is below the required ${required_major}.${required_minor}"
            exit 1
          fi
          echo "Xcode version: $xcode_version_line (>= ${required_major}.${required_minor})"
          # VOL-173: iOS Simulator runtime probe. Xcode auto-update, storage
          # cleanup, or a botched Components install can leave the device
          # types registered while the runtime resolves to (null). The
          # downstream failure is a 30-second `xcodebuild -showdestinations`
          # log dump that bottoms out in "iOS X.Y is not installed" — fail
          # fast here with a precise message instead. We assert at least one
          # available iOS 26.x runtime rather than pinning to a patch version
          # so Xcode point updates don't churn this gate. If the available
          # set is empty, install with `xcodebuild -downloadPlatform iOS`
          # on the runner (see docs/CONTRIBUTING.md "Runner maintenance").
          ios_runtime_count=$(xcrun simctl list runtimes -j 2>/dev/null \
            | jq '[.runtimes[]? | select(.isAvailable == true) | select(.version | startswith("26."))] | length' \
            2>/dev/null || echo 0)
          if [ "${ios_runtime_count:-0}" -lt 1 ]; then
            echo "::error::No available iOS 26.x simulator runtime on this runner."
            echo "::error::Install with: xcodebuild -downloadPlatform iOS  (or Xcode > Settings > Platforms)"
            echo "::error::Available runtimes follow:"
            xcrun simctl list runtimes 2>&1 || true
            exit 1
          fi
          echo "iOS runtime: ${ios_runtime_count} available iOS 26.x runtime(s)"
          # Absolute-available is more meaningful than percent on shared
          # runner Macs with big drives; iOS build+test needs ~5GB headroom.
          avail_gb=$(df -g "$HOME" | awk 'NR==2 {print $4}')
          if [ "${avail_gb:-0}" -lt 10 ]; then
            echo "::error::Disk has only ${avail_gb}GB available (need >=10GB)"
            exit 1
          fi
          echo "Disk avail: ${avail_gb}GB"
          echo "Pre-flight OK"
        shell: bash

      - name: Test Xcode Cloud config patch
        run: ./scripts/test_ci_post_clone_config_patch.sh

      - name: Test Xcode Cloud archive contract hook
        run: ./scripts/test_ci_post_xcodebuild_archive_contract.sh

      - name: Validate watch AppIcon asset catalog
        run: ruby scripts/validate_watch_app_icon_asset.rb

      - name: Generate Xcode project
        run: ruby scripts/generate_xcode_project.rb

      - name: Xcode project determinism gate
        # VOL-95: regenerate twice and fail if the output diverges. Without
        # this, xcodeproj's random SecureRandom UUIDs would thrash every
        # object's identifier on each regen, making merges a game of
        # whack-a-mole. Runs before builds/tests so a regression fails
        # fast instead of wasting 20+ minutes of runner time.
        run: ./scripts/test_xcode_project_determinism.sh

      - name: Xcode project no-op regen gate
        # VOL-106: the determinism gate above only proves two fresh runs
        # match each other -- it passes even when the committed pbxproj
        # has drifted from what the generator produces. This gate catches
        # the drift: regenerate over the committed project and fail on
        # any diff. Prevents `ruby scripts/generate_xcode_project.rb`
        # from producing 300-line UUID churn on PR branches because a
        # contributor added a source file without regenerating, or a
        # volatile input (e.g. `git rev-list --count HEAD`) leaked back
        # into the generator.
        run: ./scripts/test_xcode_project_regen_idempotent.sh

      - name: Watch app archive gate
        run: ruby scripts/test_watch_app_embedding.rb

      - name: Seed SPM lockfile into workspace
        # VOL-90: the canonical `Package.resolved` lives at repo root
        # because the `.xcworkspace/` dir is gitignored (rebuilt by
        # xcodebuild on every resolve). Seeding the workspace copy from
        # the tracked root copy pins the Sentry version the generator
        # declared — otherwise xcodebuild would re-resolve against the
        # upstream index and could pick a different commit on every run.
        # Belt-and-suspenders: the ruby generator also seeds, but having
        # it here makes the intent visible and survives generator churn.
        run: |
          mkdir -p VolumeArcApple.xcodeproj/project.xcworkspace/xcshareddata/swiftpm
          cp Package.resolved VolumeArcApple.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved

      - name: Clear stale system DerivedData
        # Belt-and-suspenders: scripts now use per-job DerivedData via
        # -derivedDataPath (VOL-75 P2 / PR #42), so stale system-level
        # DerivedData shouldn't matter. Keeping this to clean up any legacy
        # directories left from pre-#42 runs, and as a safety net in case a
        # developer running the script locally mixes configurations.
        run: |
          set -euo pipefail
          shopt -s nullglob
          stale_dirs=("$HOME/Library/Developer/Xcode/DerivedData"/VolumeArcApple-*)
          if [ ${#stale_dirs[@]} -gt 0 ]; then
            rm -rf "${stale_dirs[@]}"
            echo "Cleared ${#stale_dirs[@]} legacy DerivedData directory(ies)."
          else
            echo "No legacy VolumeArcApple-* DerivedData to clear."
          fi
        shell: bash

      - name: Build all targets (Debug)
        run: ./scripts/build_all_targets.sh

      - name: Run tests
        run: ./scripts/test_apple_targets.sh

      - name: Coverage gate (VolumeArcCore >= 80%)
        run: ./scripts/check_coverage.sh

      # VOL-205: per-target coverage gates. The platform commitment in
      # `docs/PLATFORM.md` is 90%+ across appropriate surfaces
      # (VOL-140 uplift target). This PR introduces the second per-
      # target gate — VolumeArcUI — at a deliberately conservative
      # **2% floor**. First run showed actual VolumeArcUI line
      # coverage at 2.59%; the SwiftUI layer is exercised mostly via
      # XCUITest journey tests (which don't accrue line coverage on
      # the static library targets), so the line-coverage figure is
      # structurally low and will only meaningfully rise once VOL-141
      # / VOL-200 land real coverage in the form of unit-testable
      # extracted view-model logic. The 2% floor is a guard-rail
      # ("don't regress past current") not a target — the real lift
      # mechanism is VOL-200 (journey coverage gate) + VOL-201
      # (snapshot baselines) + VOL-138/139 (Watch / Widget test
      # targets). Each of those, when it lands, ratchets the floor
      # upward in the same PR.
      - name: Coverage gate (VolumeArcUI >= 2% — staged ratchet)
        env:
          COVERAGE_TARGET: VolumeArcUI
          COVERAGE_THRESHOLD: '2'
          COVERAGE_SUMMARY_JSON: .build/coverage-summary-volumearcui.json
        run: ./scripts/check_coverage.sh

      # VOL-200 Phase 1: user-journey coverage gate. Parses
      # `docs/USER_JOURNEYS.md`, counts rows with paired XCUITests vs.
      # `[ ]` (uncovered), and fails the build below the threshold.
      # Phase 1 baseline was 18% (11/62 covered, 2026-05-18). VOL-200
      # Phase 2 (coach surface) bumped coverage to 23% (15/63 covered:
      # +1 row total in the catalog, +3 newly-covered coach rows).
      # The platform commits to 100% by end of Wave 2 (VOL-141/VOL-200).
      # Same ratchet contract as the per-target coverage gate above:
      # any PR that adds a journey test bumps `JOURNEY_COVERAGE_THRESHOLD`
      # in lockstep so the gate is always at-or-above current coverage.
      - name: Journey coverage gate (>= 23% staged ratchet)
        env:
          JOURNEY_COVERAGE_THRESHOLD: '23'
        run: ./scripts/check_journey_coverage.sh

      # VOL-97: publish the xcresult bundle so reviewers can open it in
      # Xcode without re-running CI. Runs on success and failure so a
      # broken run still yields a downloadable artifact.
      #
      # VOL-103: `continue-on-error: true` because the runner
      # `_actions/` cache races between concurrent jobs and the action
      # tarball can disappear mid-job ("Can't find action.yml under
      # actions/upload-artifact/v4"). The xcresult upload is a
      # quality-of-life artifact, not a correctness gate — letting the
      # cache race fail the entire job (after tests + coverage already
      # passed) was wasting reviewer time on admin-merges. Better to land
      # green and report a step-summary warning when the upload misses.
      # Tracking the underlying race in VOL-103 for a real fix.
      - name: Upload xcresult
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: TestResults-${{ github.run_id }}
          path: |
            .build/derived-data/TestResults.xcresult
            .build/derived-data/ui-test-attempt-*.log
          retention-days: 14

      # VOL-97: machine-readable coverage summary so the sticky PR
      # comment and the trend-append step have a stable handoff file.
      # VOL-103: same continue-on-error treatment as Upload xcresult.
      - name: Upload coverage summary
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: CoverageSummary-${{ github.run_id }}
          path: .build/coverage-summary.json
          retention-days: 14
          if-no-files-found: ignore

      # VOL-97: post a sticky coverage comment on PR runs so reviewers
      # see the gate result without opening the log. Uses
      # actions/github-script (first-party action; policy forbids
      # reaching for third-party sticky-comment actions) with a
      # find-or-create pattern keyed on a hidden marker.
      # VOL-103: same continue-on-error treatment.
      - name: Sticky PR coverage comment
        if: always() && github.event_name == 'pull_request'
        continue-on-error: true
        uses: actions/github-script@v9
        with:
          script: |
            const fs = require('fs');
            const path = '.build/coverage-summary.json';
            if (!fs.existsSync(path)) {
              core.info('No coverage-summary.json on disk; skipping sticky comment.');
              return;
            }
            const data = JSON.parse(fs.readFileSync(path, 'utf8'));
            const marker = '<!-- volumearc-coverage-comment -->';
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;

            // VOL-140 Phase 1: render one row per measured target if
            // the multi-target array is present; fall back to the
            // single-row layout for back-compat with any old summary
            // JSON still on disk.
            const formatGate = (row) => {
              if (!row.gated) return '_(measure only)_';
              return row.passed
                ? `passed (>= ${row.threshold}%)`
                : `FAILED (< ${row.threshold}%)`;
            };

            const rows = Array.isArray(data.targets) && data.targets.length
              ? data.targets
              : [{
                  target: data.target,
                  coverage: data.coverage,
                  gated: true,
                  threshold: data.threshold,
                  passed: data.passed,
                }];

            const tableLines = [
              '| Module | Coverage | Gate |',
              '|---|---:|---|',
              ...rows.map((row) => `| \`${row.target}\` | ${row.coverage}% | ${formatGate(row)} |`),
            ];

            const body = [
              marker,
              '### Coverage',
              '',
              ...tableLines,
              '',
              `Full report: [xcresult artifact](${runUrl}) (TestResults-${context.runId}, 14-day retention)`,
            ].join('\n');

            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;
            const { data: comments } = await github.rest.issues.listComments({
              owner, repo, issue_number, per_page: 100,
            });
            const existing = comments.find((c) => c.body && c.body.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({
                owner, repo, comment_id: existing.id, body,
              });
              core.info(`Updated sticky coverage comment ${existing.id}.`);
            } else {
              await github.rest.issues.createComment({
                owner, repo, issue_number, body,
              });
              core.info('Created sticky coverage comment.');
            }

      # VOL-97 / VOL-166: historical trend stored on the unprotected
      # `metrics` branch (orphan, data-only). Pushing to main is blocked
      # by the `Require AI Code Reviews` ruleset — verified May 9 by
      # tracing run 25562451096's `Failed to push coverage-trend update
      # after 3 attempts` warning. The bot can push freely to any
      # non-protected branch, and a separate `metrics` branch keeps
      # data writes off the code branch.
      #
      # Read the trend via the GitHub Pages-style URL pattern:
      #   https://raw.githubusercontent.com/<repo>/metrics/coverage-trend.json
      #
      # The append step is guarded on event_name + ref so PR runs and
      # tag-build runs are no-ops. Uses the job-scoped GITHUB_TOKEN
      # (needs `permissions: contents: write`, granted at the job
      # level above) — no extra PAT required.
      - name: Append coverage to metrics branch
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && success()
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [[ ! -f .build/coverage-summary.json ]]; then
            echo "::warning::No coverage-summary.json; skipping trend append."
            exit 0
          fi

          # Snapshot the summary so the metrics worktree can read it
          # after we switch branches.
          cp .build/coverage-summary.json /tmp/coverage-summary.json

          # Stage a clean worktree on the metrics branch. If it doesn't
          # exist yet, bootstrap an orphan branch with just the trend file.
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # Codex review (PR #144): a bare `git fetch origin metrics --depth=1`
          # only populates FETCH_HEAD, not `origin/metrics`, in the
          # single-branch checkout that `actions/checkout@v6` produces. Use an
          # explicit destination refspec so `git rev-parse --verify
          # origin/metrics` resolves on every run after bootstrap. `|| true`
          # keeps the first-ever run (where the remote ref doesn't exist)
          # from short-circuiting before the orphan-branch path runs.
          git fetch origin 'metrics:refs/remotes/origin/metrics' --depth=1 2>/dev/null || true

          metrics_dir="$(mktemp -d)"

          # CodeRabbit review (PR #144): persistent self-hosted runners
          # accumulate `.git/worktrees/` orphans without an explicit cleanup.
          # `git worktree remove --force` is idempotent against missing or
          # already-pruned worktrees, so the trap is safe on both happy and
          # error paths.
          cleanup_metrics_worktree() {
            cd "$GITHUB_WORKSPACE"
            git worktree remove --force "$metrics_dir" 2>/dev/null || true
          }
          trap cleanup_metrics_worktree EXIT

          if git rev-parse --verify origin/metrics >/dev/null 2>&1; then
            git worktree add "$metrics_dir" origin/metrics
            cd "$metrics_dir"
            git checkout -B metrics origin/metrics
          else
            git worktree add --detach "$metrics_dir"
            cd "$metrics_dir"
            # Codex review (PR #144 round 3): on a persistent self-hosted
            # runner, a prior bootstrap whose `git push origin metrics`
            # failed leaves a stale local `metrics` ref in
            # `.git/refs/heads/`. The next run still sees no
            # `origin/metrics`, lands here, and `git checkout --orphan
            # metrics` errors with "a branch named 'metrics' already
            # exists" because `--orphan` (unlike `-B`) cannot reset an
            # existing branch. Delete any stale local ref before
            # bootstrapping so the orphan path is idempotent.
            git branch -D metrics 2>/dev/null || true
            git checkout --orphan metrics
            git rm -rf . >/dev/null 2>&1 || true
            printf '%s\n' \
              '# metrics' \
              '' \
              'Data-only branch. Read from GitHub raw URLs; do not edit by hand.' \
              '' \
              'See `docs/TESTING.md#coverage-artifacts` and the badge in `docs/PLATFORM.md`.' \
              > README.md
          fi

          python3 <<'PY'
          import json, os, datetime
          summary = json.load(open("/tmp/coverage-summary.json"))
          trend_path = "coverage-trend.json"
          try:
              trend = json.load(open(trend_path))
          except FileNotFoundError:
              trend = {
                  "target": summary["target"],
                  "threshold": summary["threshold"],
                  "note": "Append-only log of per-target line coverage per main-branch commit. Written by .github/workflows/ci.yml (VOL-97 / VOL-166 / VOL-140). Stored on `metrics` branch — the `main` branch's docs/coverage-trend.json is a placeholder.",
                  "records": [],
              }
          sha = os.environ.get("GITHUB_SHA", "")
          date = datetime.datetime.now(datetime.timezone.utc).strftime("%Y-%m-%dT%H:%M:%SZ")
          records = trend.setdefault("records", [])
          # Avoid duplicate records if the workflow re-runs on the same
          # commit (e.g. manual re-run from the UI).
          if any(r.get("commit") == sha for r in records):
              print(f"Skipping duplicate record for {sha}.")
          else:
              # VOL-140 Phase 1: persist per-target measurements so the
              # trend file lets us calibrate per-module thresholds in
              # Phase 2. The legacy top-level `coverage`/`passed` fields
              # are still written for back-compat with any chart that
              # reads them.
              per_target = {}
              for row in summary.get("targets") or []:
                  per_target[row["target"]] = {
                      "coverage": row["coverage"],
                      "executable": row.get("executable", 0),
                      "covered": row.get("covered", 0),
                  }
              records.append({
                  "commit": sha,
                  "date": date,
                  "coverage": summary["coverage"],
                  "passed": summary["passed"],
                  "targets": per_target,
              })
              with open(trend_path, "w", encoding="utf-8") as handle:
                  json.dump(trend, handle, indent=2)
                  handle.write("\n")
              print(f"Appended record for {sha}: {summary['coverage']}%")
          PY

          # Codex review (PR #144): stage first, then ask the index whether
          # anything actually changed. The previous order — `git diff --quiet
          # coverage-trend.json` before `git add` — silently no-op'd the
          # bootstrap commit because `git diff` returns 0 for *untracked*
          # files (the orphan branch's first run creates the trend file
          # untracked, so the diff check passed and existing_count=1 then
          # exited before staging). `git diff --cached --quiet` after staging
          # handles all three cases correctly:
          #   - bootstrap (orphan): README + trend are new index entries → non-zero → commit
          #   - update (existing): trend has a new record vs HEAD → non-zero → commit
          #   - duplicate (re-run): trend unchanged vs HEAD → zero → skip
          git add coverage-trend.json README.md 2>/dev/null || git add coverage-trend.json

          if git diff --cached --quiet; then
            echo "No staged changes to coverage trend; skipping commit."
            exit 0
          fi

          git commit -m "chore(metrics): coverage trend for ${GITHUB_SHA::7} (${{ github.run_id }})"

          # Push with retry on non-fast-forward; another concurrent
          # main run may have appended first.
          for attempt in 1 2 3; do
            if git push origin metrics; then
              echo "Pushed coverage trend update to metrics branch."
              exit 0
            fi
            echo "Push attempt $attempt failed; rebasing and retrying."
            git fetch origin metrics --depth=1 || true
            git pull --rebase origin metrics || true
          done
          echo "::warning::Failed to push coverage-trend update to metrics after 3 attempts."

      - name: Lint (SwiftLint)
        # VOL-113: `--strict` re-enabled now that all warnings clear.
        # Original `--strict` was dropped under VOL-77 to keep the SwiftLint
        # gate from blocking PR #47 on ~20 pre-existing length violations.
        # VOL-87 + VOL-113 finished the cleanup — VolumeArcApp.swift is split
        # into VolumeArcApp.swift (@main shell) + VolumeArcAppFactories.swift
        # (platform makers); the four remaining big files (WatchWorkoutView,
        # WorkoutDashboardModel, DataModels, Components) have their length
        # thresholds documented in `.swiftlint.yml`. From here every warning
        # is a hard-fail so debt can't silently accumulate.
        #
        # Pre-flight above asserts the binary is on PATH, so we always
        # lint — no silent skip.
        run: swiftlint lint --strict

      - name: Validate release configuration
        run: ./scripts/validate_release_config.sh

  perf-regression:
    # VOL-99: performance regression suite. Tag-gated because each
    # measured test runs multiple iterations — running it on every PR
    # would balloon CI time for no signal on non-perf changes. The gate
    # hard-fails tag builds (preventing TestFlight deploy) when any
    # metric exceeds its fail threshold declared in
    # `docs/performance-budgets.json`.
    name: Performance budgets (VOL-99)
    needs: build-and-test
    # VOL-132 (defense in depth): the tag-only filter already prevents
    # fork PRs from triggering this job (forks can't push tags upstream),
    # but combining with the explicit fork guard keeps the same security
    # posture if the tag filter is ever loosened.
    if: |
      startsWith(github.ref, 'refs/tags/v') &&
      (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: [self-hosted, mv-volumearc-runner]
    timeout-minutes: 45
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Prepare Ruby toolchain
        run: bash ./.github/scripts/prepare_ruby_toolchain.sh xcodeproj
        shell: bash

      - name: Pre-flight
        run: |
          set -euo pipefail
          ruby --version
          xcode_version_output=$(xcodebuild -version)
          printf '%s\n' "$xcode_version_output"
          gem list xcodeproj --installed --version '>= 1.0' >/dev/null
          # Toolchain pin: Xcode 26.4+ required (mirrors build-and-test).
          xcode_version_line=$(printf '%s\n' "$xcode_version_output" | awk 'NR==1 {print $2}')
          xcode_major=$(echo "$xcode_version_line" | awk -F. '{print $1}')
          xcode_minor=$(echo "$xcode_version_line" | awk -F. '{print $2+0}')
          required_major=26
          required_minor=4
          if [ "${xcode_major:-0}" -lt "$required_major" ] \
             || { [ "${xcode_major:-0}" -eq "$required_major" ] \
                  && [ "${xcode_minor:-0}" -lt "$required_minor" ]; }; then
            echo "::error::Xcode $xcode_version_line is below the required ${required_major}.${required_minor}"
            exit 1
          fi
          # VOL-173: iOS Simulator runtime probe (mirrors build-and-test).
          ios_runtime_count=$(xcrun simctl list runtimes -j 2>/dev/null \
            | jq '[.runtimes[]? | select(.isAvailable == true) | select(.version | startswith("26."))] | length' \
            2>/dev/null || echo 0)
          if [ "${ios_runtime_count:-0}" -lt 1 ]; then
            echo "::error::No available iOS 26.x simulator runtime on this runner."
            echo "::error::Install with: xcodebuild -downloadPlatform iOS  (or Xcode > Settings > Platforms)"
            xcrun simctl list runtimes 2>&1 || true
            exit 1
          fi
        shell: bash

      - name: Run performance suite
        run: ./scripts/test_performance.sh

      - name: Enforce performance budgets
        run: ./scripts/check_performance.sh

      - name: Upload perf xcresult on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: perf-results-${{ github.sha }}
          path: .build/perf-results.xcresult
          retention-days: 14

  # VOL-126: TestFlight deploy moved to Xcode Cloud.
  # ─────────────────────────────────────────────────
  # Apple-managed signing eliminates the cert/profile bootstrap that
  # blocked the GitHub Actions deploy path (no fastlane match, no
  # private cert repo, no SSH deploy keys, no MATCH_PASSWORD). The
  # Xcode Cloud workflow lives in App Store Connect (configured per
  # docs/RELEASE.md) and triggers on tag pushes matching `v*`.
  # `ci_scripts/ci_post_xcodebuild.sh` runs after each archive and
  # uploads dSYMs to Sentry — so VOL-133's dSYM contract is preserved.
  #
  # GitHub Actions still owns the substantive validation gates:
  # build, unit + UI tests, perf-regression (VOL-99), SwiftLint, and
  # release-config validation — every PR + every push to main runs
  # the full suite on the dedicated mv-volumearc-runner.
