name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build & Test
    runs-on: [self-hosted, mv-shared]
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Ruby gem path
        run: |
          echo "GEM_HOME=$HOME/.gem" >> "$GITHUB_ENV"
          echo "$HOME/.gem/bin" >> "$GITHUB_PATH"

      - name: Verify Ruby and xcodeproj gem
        run: |
          ruby --version
          gem list xcodeproj --installed --version '>= 1.0' || gem install --user-install xcodeproj

      - name: Generate Xcode project
        run: ruby scripts/generate_xcode_project.rb

      - name: Clear stale SPM artifacts
        # VOL-75 workaround: the self-hosted runner's DerivedData survives between
        # runs, so partial SPM artifact downloads (e.g., the Sentry XCFramework)
        # can go stale and cause `error: There is no XCFramework found at ...`
        # failures that look like code bugs. Nuking the project-specific
        # DerivedData before every build forces SPM to re-resolve cleanly. Only
        # touches VolumeArcApple-* so we don't stomp on unrelated workspaces
        # that share the runner.
        run: |
          set -euo pipefail
          shopt -s nullglob
          stale_dirs=("$HOME/Library/Developer/Xcode/DerivedData"/VolumeArcApple-*)
          if [ ${#stale_dirs[@]} -gt 0 ]; then
            rm -rf "${stale_dirs[@]}"
            echo "Cleared ${#stale_dirs[@]} stale DerivedData directory(ies)."
          else
            echo "No stale VolumeArcApple-* DerivedData to clear."
          fi
        shell: bash

      - name: Build all targets (Debug)
        run: ./scripts/build_all_targets.sh

      - name: Run tests
        run: ./scripts/test_apple_targets.sh

      - name: Lint (SwiftLint)
        run: |
          if command -v swiftlint &>/dev/null; then
            swiftlint lint --strict
          else
            echo "::warning::SwiftLint not installed on runner — skipping lint step"
          fi

      - name: Validate release configuration
        run: ./scripts/validate_release_config.sh

  deploy-testflight:
    name: Deploy to TestFlight
    needs: build-and-test
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: [self-hosted, mv-shared]
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install dependencies
        run: bundle install

      - name: Deploy to TestFlight
        env:
          DEVELOPMENT_TEAM: ${{ secrets.DEVELOPMENT_TEAM }}
          APP_STORE_CONNECT_API_KEY_PATH: ${{ secrets.APP_STORE_CONNECT_API_KEY_PATH }}
        run: bundle exec fastlane ios beta
