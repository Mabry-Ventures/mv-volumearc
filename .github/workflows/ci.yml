name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # VOL-88: the current GitHub runner inventory exposes the dedicated
  # Apple Silicon machine with the `mv-shared` label. Keep only portable
  # base tool locations here; prepare_ruby_toolchain.sh appends Ruby and
  # gem bins dynamically via GITHUB_PATH after detecting the runner image.
  PATH: /opt/homebrew/bin:/opt/homebrew/sbin:/usr/local/bin:/usr/bin:/bin:/usr/sbin:/sbin

jobs:
  build-and-test:
    name: Build & Test
    # VOL-132: fork-PR guard. The `mv-shared` self-hosted runner is a
    # privileged macOS host (Apple Developer signing identity, Keychain,
    # decoded SSH key for git operations, persistent DerivedData / SPM
    # cache, prior-job artifacts). A fork PR carries arbitrary code from a
    # contributor outside the upstream repo; allowing it to execute on
    # `mv-shared` would let that code read or modify any of the above.
    # This guard skips the job on PRs whose head repository differs from
    # the upstream — push events (main + tags) and same-repo PRs run as
    # normal. Fork contributors should ask a maintainer to push their
    # branch into the upstream so CI can execute against trusted code.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, mv-volumearc-runner]
    # VOL-88 / VOL-111 / VOL-112: self-hosted macOS runners may start
    # with no warm DerivedData / SPM cache, so a cold first run can spend
    # a long time compiling Sentry's Swift dependencies and all simulator
    # targets from source before the app's own tests execute.
    #
    # PR #88 proved 90 min is still too tight on a cold runner: build-all
    # completed after ~68 min, unit tests passed, then the job was canceled
    # while the UI test target was still building/running. 150 min gives
    # full build + unit/UI tests + coverage/lint/release validation enough
    # headroom while cache work lands.
    # A future follow-up (snapshot caching of DerivedData into the runner
    # image) would let us drop this back down.
    timeout-minutes: 150
    # VOL-97: the post-merge coverage-trend append step commits back to
    # main, so the job-scoped GITHUB_TOKEN needs write access to
    # repository contents. PR jobs don't commit; the same permission is
    # harmless there because branch protection on main + the
    # `if: github.event_name == 'push'` guard on the append step are
    # what actually gate the write. `pull-requests: write` lets the
    # sticky PR comment step create/update the coverage comment via
    # actions/github-script.
    permissions:
      contents: write
      pull-requests: write

    steps:
      # VOL-103: `continue-on-error: true` covers both the main checkout
      # and the auto-injected Post Checkout cleanup. The cleanup step
      # races against the runner's `_actions/` cache and fails with
      # "Can't find action.yml under actions/checkout/v6" when another
      # job interferes. Letting it fail the job would mask successful
      # test + coverage runs. The main checkout itself isn't risky to
      # tolerate failures on — if it fails, every subsequent build/test
      # step will fail loudly with missing source-tree errors.
      - name: Checkout
        continue-on-error: true
        uses: actions/checkout@v6

      - name: Verify checkout succeeded
        run: |
          set -euo pipefail
          test -d .git || { echo "::error::.git directory missing after checkout"; exit 1; }
          head_sha=$(git rev-parse HEAD)
          if [ "$head_sha" != "$GITHUB_SHA" ]; then
            echo "::error::Checkout HEAD $head_sha does not match GITHUB_SHA $GITHUB_SHA"
            exit 1
          fi
        shell: bash

      - name: Prepare Ruby toolchain
        # VOL-109/VOL-110 PR unblock: runner images may have
        # Homebrew on PATH without the ruby formula installed/linked, which
        # leaves `ruby` resolving to macOS' EOL system Ruby despite the static
        # PATH above. Bootstrap the Homebrew Ruby explicitly and publish the
        # actual Ruby + gem bin dirs to following steps.
        run: bash ./.github/scripts/prepare_ruby_toolchain.sh xcodeproj
        shell: bash

      - name: Pre-flight
        # VOL-75: fail fast if the runner is missing something required.
        # Cheaper than a 20-minute build that dies at step 6 on a sick runner.
        run: |
          set -euo pipefail
          echo "PATH=$PATH"
          xcode_version_output=$(xcodebuild -version)
          printf '%s\n' "$xcode_version_output"
          ruby --version | grep -qE 'ruby (3|4)\.' || { echo "::error::Ruby < 3.0 (EOL)"; exit 1; }
          gem list xcodeproj --installed --version '>= 1.0' >/dev/null || { echo "::error::xcodeproj gem missing"; exit 1; }
          command -v swiftlint >/dev/null || { echo "::error::swiftlint missing on runner"; exit 1; }
          # Toolchain pin: Xcode 26.4+ is required so the Swift 6.3 language
          # mode and the iOS 26 SDK that build settings depend on are
          # available. `xcodebuild -version` prints e.g. "Xcode 26.4" on the
          # first line; parse the version components and compare against the
          # required minimum. If the runner's Xcode is older the build would
          # fail later with a confusing "unsupported Swift compiler version"
          # — fail here with a precise message instead.
          xcode_version_line=$(printf '%s\n' "$xcode_version_output" | awk 'NR==1 {print $2}')
          xcode_major=$(echo "$xcode_version_line" | awk -F. '{print $1}')
          xcode_minor=$(echo "$xcode_version_line" | awk -F. '{print $2+0}')
          required_major=26
          required_minor=4
          if [ "${xcode_major:-0}" -lt "$required_major" ] \
             || { [ "${xcode_major:-0}" -eq "$required_major" ] \
                  && [ "${xcode_minor:-0}" -lt "$required_minor" ]; }; then
            echo "::error::Xcode $xcode_version_line is below the required ${required_major}.${required_minor}"
            exit 1
          fi
          echo "Xcode version: $xcode_version_line (>= ${required_major}.${required_minor})"
          # Absolute-available is more meaningful than percent on shared
          # runner Macs with big drives; iOS build+test needs ~5GB headroom.
          avail_gb=$(df -g "$HOME" | awk 'NR==2 {print $4}')
          if [ "${avail_gb:-0}" -lt 10 ]; then
            echo "::error::Disk has only ${avail_gb}GB available (need >=10GB)"
            exit 1
          fi
          echo "Disk avail: ${avail_gb}GB"
          echo "Pre-flight OK"
        shell: bash

      - name: Generate Xcode project
        run: ruby scripts/generate_xcode_project.rb

      - name: Xcode project determinism gate
        # VOL-95: regenerate twice and fail if the output diverges. Without
        # this, xcodeproj's random SecureRandom UUIDs would thrash every
        # object's identifier on each regen, making merges a game of
        # whack-a-mole. Runs before builds/tests so a regression fails
        # fast instead of wasting 20+ minutes of runner time.
        run: ./scripts/test_xcode_project_determinism.sh

      - name: Xcode project no-op regen gate
        # VOL-106: the determinism gate above only proves two fresh runs
        # match each other -- it passes even when the committed pbxproj
        # has drifted from what the generator produces. This gate catches
        # the drift: regenerate over the committed project and fail on
        # any diff. Prevents `ruby scripts/generate_xcode_project.rb`
        # from producing 300-line UUID churn on PR branches because a
        # contributor added a source file without regenerating, or a
        # volatile input (e.g. `git rev-list --count HEAD`) leaked back
        # into the generator.
        run: ./scripts/test_xcode_project_regen_idempotent.sh

      - name: Seed SPM lockfile into workspace
        # VOL-90: the canonical `Package.resolved` lives at repo root
        # because the `.xcworkspace/` dir is gitignored (rebuilt by
        # xcodebuild on every resolve). Seeding the workspace copy from
        # the tracked root copy pins the Sentry version the generator
        # declared — otherwise xcodebuild would re-resolve against the
        # upstream index and could pick a different commit on every run.
        # Belt-and-suspenders: the ruby generator also seeds, but having
        # it here makes the intent visible and survives generator churn.
        run: |
          mkdir -p VolumeArcApple.xcodeproj/project.xcworkspace/xcshareddata/swiftpm
          cp Package.resolved VolumeArcApple.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved

      - name: Clear stale system DerivedData
        # Belt-and-suspenders: scripts now use per-job DerivedData via
        # -derivedDataPath (VOL-75 P2 / PR #42), so stale system-level
        # DerivedData shouldn't matter. Keeping this to clean up any legacy
        # directories left from pre-#42 runs, and as a safety net in case a
        # developer running the script locally mixes configurations.
        run: |
          set -euo pipefail
          shopt -s nullglob
          stale_dirs=("$HOME/Library/Developer/Xcode/DerivedData"/VolumeArcApple-*)
          if [ ${#stale_dirs[@]} -gt 0 ]; then
            rm -rf "${stale_dirs[@]}"
            echo "Cleared ${#stale_dirs[@]} legacy DerivedData directory(ies)."
          else
            echo "No legacy VolumeArcApple-* DerivedData to clear."
          fi
        shell: bash

      - name: Build all targets (Debug)
        run: ./scripts/build_all_targets.sh

      - name: Run tests
        run: ./scripts/test_apple_targets.sh

      - name: Coverage gate (VolumeArcCore >= 80%)
        run: ./scripts/check_coverage.sh

      # VOL-97: publish the xcresult bundle so reviewers can open it in
      # Xcode without re-running CI. Runs on success and failure so a
      # broken run still yields a downloadable artifact.
      #
      # VOL-103: `continue-on-error: true` because the runner
      # `_actions/` cache races between concurrent jobs and the action
      # tarball can disappear mid-job ("Can't find action.yml under
      # actions/upload-artifact/v4"). The xcresult upload is a
      # quality-of-life artifact, not a correctness gate — letting the
      # cache race fail the entire job (after tests + coverage already
      # passed) was wasting reviewer time on admin-merges. Better to land
      # green and report a step-summary warning when the upload misses.
      # Tracking the underlying race in VOL-103 for a real fix.
      - name: Upload xcresult
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: TestResults-${{ github.run_id }}
          path: |
            .build/derived-data/TestResults.xcresult
            .build/derived-data/ui-test-attempt-*.log
          retention-days: 14

      # VOL-97: machine-readable coverage summary so the sticky PR
      # comment and the trend-append step have a stable handoff file.
      # VOL-103: same continue-on-error treatment as Upload xcresult.
      - name: Upload coverage summary
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: CoverageSummary-${{ github.run_id }}
          path: .build/coverage-summary.json
          retention-days: 14
          if-no-files-found: ignore

      # VOL-97: post a sticky coverage comment on PR runs so reviewers
      # see the gate result without opening the log. Uses
      # actions/github-script (first-party action; policy forbids
      # reaching for third-party sticky-comment actions) with a
      # find-or-create pattern keyed on a hidden marker.
      # VOL-103: same continue-on-error treatment.
      - name: Sticky PR coverage comment
        if: always() && github.event_name == 'pull_request'
        continue-on-error: true
        uses: actions/github-script@v9
        with:
          script: |
            const fs = require('fs');
            const path = '.build/coverage-summary.json';
            if (!fs.existsSync(path)) {
              core.info('No coverage-summary.json on disk; skipping sticky comment.');
              return;
            }
            const data = JSON.parse(fs.readFileSync(path, 'utf8'));
            const marker = '<!-- volumearc-coverage-comment -->';
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const gate = data.passed ? `passed (>= ${data.threshold}%)` : `FAILED (< ${data.threshold}%)`;
            const body = [
              marker,
              '### Coverage',
              '',
              '| Module | Coverage | Gate |',
              '|---|---|---|',
              `| ${data.target} | ${data.coverage}% | ${gate} |`,
              '',
              `Full report: [xcresult artifact](${runUrl}) (TestResults-${context.runId}, 14-day retention)`,
            ].join('\n');

            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;
            const { data: comments } = await github.rest.issues.listComments({
              owner, repo, issue_number, per_page: 100,
            });
            const existing = comments.find((c) => c.body && c.body.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({
                owner, repo, comment_id: existing.id, body,
              });
              core.info(`Updated sticky coverage comment ${existing.id}.`);
            } else {
              await github.rest.issues.createComment({
                owner, repo, issue_number, body,
              });
              core.info('Created sticky coverage comment.');
            }

      # VOL-97: historical trend. On every push to main we append a
      # {commit, date, coverage} record to docs/coverage-trend.json and
      # commit it back. The append step is guarded on the event name +
      # ref so PR runs and tag-build runs are no-ops. We use the
      # job-scoped GITHUB_TOKEN (needs `permissions: contents: write`,
      # granted at the job level above) — no extra PAT required. If a
      # repo-level branch protection rule ever blocks bot pushes to
      # main, flip this block to open a PR via peter-evans/create-pull-request
      # or disable it with a TODO.
      - name: Append coverage to trend
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && success()
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [[ ! -f .build/coverage-summary.json ]]; then
            echo "::warning::No coverage-summary.json; skipping trend append."
            exit 0
          fi
          python3 <<'PY'
          import json, os, subprocess, datetime
          summary = json.load(open(".build/coverage-summary.json"))
          trend_path = "docs/coverage-trend.json"
          try:
              trend = json.load(open(trend_path))
          except FileNotFoundError:
              trend = {
                  "target": summary["target"],
                  "threshold": summary["threshold"],
                  "note": "Append-only log of VolumeArcCore line coverage per main-branch commit.",
                  "records": [],
              }
          sha = os.environ.get("GITHUB_SHA", "")
          date = datetime.datetime.now(datetime.timezone.utc).strftime("%Y-%m-%dT%H:%M:%SZ")
          records = trend.setdefault("records", [])
          # Avoid duplicate records if the workflow re-runs on the same
          # commit (e.g. manual re-run from the UI).
          if any(r.get("commit") == sha for r in records):
              print(f"Skipping duplicate record for {sha}.")
          else:
              records.append({
                  "commit": sha,
                  "date": date,
                  "coverage": summary["coverage"],
                  "passed": summary["passed"],
              })
              with open(trend_path, "w", encoding="utf-8") as handle:
                  json.dump(trend, handle, indent=2)
                  handle.write("\n")
              print(f"Appended record for {sha}: {summary['coverage']}%")
          PY
          if git diff --quiet docs/coverage-trend.json; then
            echo "No trend-file change; skipping commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/coverage-trend.json
          git commit -m "chore(ci): append coverage trend for ${GITHUB_SHA::7}" \
            -m "[skip ci]"
          # Push with retry on non-fast-forward; another concurrent main
          # run may have appended first.
          for attempt in 1 2 3; do
            if git push origin HEAD:main; then
              exit 0
            fi
            echo "Push attempt $attempt failed; rebasing and retrying."
            git pull --rebase origin main || true
          done
          echo "::warning::Failed to push coverage-trend update after 3 attempts."

      - name: Lint (SwiftLint)
        # VOL-113: `--strict` re-enabled now that all warnings clear.
        # Original `--strict` was dropped under VOL-77 to keep the SwiftLint
        # gate from blocking PR #47 on ~20 pre-existing length violations.
        # VOL-87 + VOL-113 finished the cleanup — VolumeArcApp.swift is split
        # into VolumeArcApp.swift (@main shell) + VolumeArcAppFactories.swift
        # (platform makers); the four remaining big files (WatchWorkoutView,
        # WorkoutDashboardModel, DataModels, Components) have their length
        # thresholds documented in `.swiftlint.yml`. From here every warning
        # is a hard-fail so debt can't silently accumulate.
        #
        # Pre-flight above asserts the binary is on PATH, so we always
        # lint — no silent skip.
        run: swiftlint lint --strict

      - name: Validate release configuration
        run: ./scripts/validate_release_config.sh

  perf-regression:
    # VOL-99: performance regression suite. Tag-gated because each
    # measured test runs multiple iterations — running it on every PR
    # would balloon CI time for no signal on non-perf changes. The gate
    # hard-fails tag builds (preventing TestFlight deploy) when any
    # metric exceeds its fail threshold declared in
    # `docs/performance-budgets.json`.
    name: Performance budgets (VOL-99)
    needs: build-and-test
    # VOL-132 (defense in depth): the tag-only filter already prevents
    # fork PRs from triggering this job (forks can't push tags upstream),
    # but combining with the explicit fork guard keeps the same security
    # posture if the tag filter is ever loosened.
    if: |
      startsWith(github.ref, 'refs/tags/v') &&
      (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: [self-hosted, mv-volumearc-runner]
    timeout-minutes: 45
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Prepare Ruby toolchain
        run: bash ./.github/scripts/prepare_ruby_toolchain.sh xcodeproj
        shell: bash

      - name: Pre-flight
        run: |
          set -euo pipefail
          ruby --version
          xcode_version_output=$(xcodebuild -version)
          printf '%s\n' "$xcode_version_output"
          gem list xcodeproj --installed --version '>= 1.0' >/dev/null
          # Toolchain pin: Xcode 26.4+ required (mirrors build-and-test).
          xcode_version_line=$(printf '%s\n' "$xcode_version_output" | awk 'NR==1 {print $2}')
          xcode_major=$(echo "$xcode_version_line" | awk -F. '{print $1}')
          xcode_minor=$(echo "$xcode_version_line" | awk -F. '{print $2+0}')
          required_major=26
          required_minor=4
          if [ "${xcode_major:-0}" -lt "$required_major" ] \
             || { [ "${xcode_major:-0}" -eq "$required_major" ] \
                  && [ "${xcode_minor:-0}" -lt "$required_minor" ]; }; then
            echo "::error::Xcode $xcode_version_line is below the required ${required_major}.${required_minor}"
            exit 1
          fi
        shell: bash

      - name: Run performance suite
        run: ./scripts/test_performance.sh

      - name: Enforce performance budgets
        run: ./scripts/check_performance.sh

      - name: Upload perf xcresult on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: perf-results-${{ github.sha }}
          path: .build/perf-results.xcresult
          retention-days: 14

  deploy-testflight:
    name: Deploy to TestFlight
    needs: [build-and-test, perf-regression]
    # VOL-132 (defense in depth): same rationale as perf-regression. This
    # job consumes `DEVELOPMENT_TEAM` + `APP_STORE_CONNECT_API_KEY_PATH`
    # secrets — the fork guard is belt-and-suspenders against a future
    # loosening of the tag-only filter.
    if: |
      startsWith(github.ref, 'refs/tags/v') &&
      (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: [self-hosted, mv-volumearc-runner]
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Prepare Ruby toolchain
        run: bash ./.github/scripts/prepare_ruby_toolchain.sh bundler xcodeproj
        shell: bash

      - name: Install dependencies
        run: bundle install

      - name: Install sentry-cli
        # VOL-133: required by the `beta` Fastlane lane to upload dSYMs to
        # Sentry so production crashes symbolicate. Idempotent — Homebrew
        # is a no-op if sentry-cli is already installed by a prior run on
        # the persistent self-hosted runner. The `getsentry/tools` tap is
        # the canonical install path per Sentry docs.
        run: |
          set -euo pipefail
          if command -v sentry-cli >/dev/null 2>&1; then
            echo "sentry-cli already installed: $(sentry-cli --version)"
          else
            brew install getsentry/tools/sentry-cli
            echo "sentry-cli installed: $(sentry-cli --version)"
          fi
        shell: bash

      - name: Deploy to TestFlight
        env:
          DEVELOPMENT_TEAM: ${{ secrets.DEVELOPMENT_TEAM }}
          APP_STORE_CONNECT_API_KEY_PATH: ${{ secrets.APP_STORE_CONNECT_API_KEY_PATH }}
          # VOL-76 remainder: set so validate_release_config.sh hard-fails
          # (not just warns) when VERSION matches the latest tag on a tag build.
          CI_TAG_BUILD: '1'
          # VOL-133: dSYM upload to Sentry. The Fastlane `beta` lane skips
          # the upload (with a warning) when the token is unset, so local
          # archive builds keep working without the secret.
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: mabry-ventures-llc
          SENTRY_PROJECT: volumearc-ios
        run: bundle exec fastlane ios beta

      - name: Upload Sentry dSYM manifest
        # VOL-133: the dSYM upload manifest captured by the beta lane is
        # uploaded as a CI artifact so the dSYMs landed on Sentry are
        # traceable per release. Optional — if the file is missing (e.g.,
        # SENTRY_AUTH_TOKEN was unset) the step is a no-op.
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: sentry-dsym-manifest-${{ github.sha }}
          path: build/sentry-dsym-manifest.json
          retention-days: 30
          if-no-files-found: ignore
