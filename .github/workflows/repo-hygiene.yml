name: Repo Hygiene
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: repo-hygiene-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  repo-hygiene:
    name: Repo Hygiene
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: ruby/setup-ruby@14594264cd68ce8a2345dd349bc3d138a4ef85c8 # v1
        with:
          ruby-version: '4.0'
      - name: Install generator dependency
        run: gem install xcodeproj --version 1.27.0 --no-document
      - name: Verify committed generator output
        run: ./scripts/test_xcode_project_regen_idempotent.sh
      - name: Verify repeatable generation
        run: ./scripts/test_xcode_project_determinism.sh
      - name: Verify Xcode Cloud coverage routing
        run: python3 scripts/__tests__/cloud_coverage_test.py
