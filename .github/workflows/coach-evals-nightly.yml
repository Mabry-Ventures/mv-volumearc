name: Coach Evals (nightly)

# VOL-147: nightly response-layer coach eval CI.
#
# VOL-226 retired the shared client HMAC credential. VOL-244 restores the
# response-layer path through a staging-only eval attestation broker: the
# harness bootstraps an ephemeral public key, then signs every fixture request
# with one-time nonce + monotonic counter headers. Production relay auth remains
# App Attest-only.
#
# Schedule + triggers:
# - Daily cron at 07:00 UTC (one window per day; the relay's Gemini
#   budget is small and burst-sensitive).
# - Manual dispatch with optional `relay_url` override so an operator
#   can re-run against staging before promoting a new prompt.
# - Same-repo PR smoke when coach prompt / relay / fixture code changes.
#   The PR path runs five fixtures only and is warning-only so model or
#   staging-relay drift is visible without making the merge gate depend on
#   third-party latency.
#
# Slack failure notifications (VOL-177 Phase 2B) will follow once
# `SLACK_BOT_TOKEN` is configured at the repo level.

on:
  schedule:
    - cron: '0 7 * * *'
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/coach-evals-nightly.yml'
      - 'VolumeArcNative/Sources/VolumeArcCore/AI/**'
      - 'VolumeArcNative/Sources/VolumeArcCore/Navigation/WorkoutDashboardModel.swift'
      - 'VolumeArcNative/Sources/VolumeArcUI/Screens/CoachView.swift'
      - 'Tests/Evals/**'
      - 'Tests/VolumeArcAppTests/Evals/**'
      - 'relay/**'
      - 'scripts/run_coach_evals.*'
  workflow_dispatch:
    inputs:
      relay_url:
        description: Optional override for VOLUMEARC_RELAY_BASE_URL (defaults to production relay)
        required: false
        default: ''

permissions:
  # VOL-207: bumped from `contents: read` to `contents: write` so the
  # nightly cron's final step (`Commit trend update on main cron`) can
  # actually push `docs/coach-eval-trend.json` back to main. Before
  # this, the trend file was being mutated locally inside the job but
  # the push step failed silently every night, leaving the public
  # quality page rendering a stale trend forever. The write scope is
  # used by exactly one step in this workflow and only on the cron
  # branch (`schedule` event + `refs/heads/main`); the workflow_dispatch
  # path still skips the commit per the existing `if:` guard.
  contents: write
  issues: write  # so a future VOL-147 follow-up can open a regression Linear ticket via gh
  pull-requests: read

concurrency:
  group: coach-evals-${{ github.workflow }}
  cancel-in-progress: false

jobs:
  coach-evals:
    name: Coach evals (fixtures)
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    # Per repo policy (docs/CONTRIBUTING.md "Runner policy: zero
    # GitHub-hosted jobs"): every workflow runs on the self-hosted
    # mv-volumearc-runner. The eval harness is a bash + curl + jq +
    # openssl pipeline; the self-hosted runner has all four in the
    # Homebrew toolchain that VOL-180 / VOL-173 already document.
    runs-on: [self-hosted, mv-volumearc-runner]
    timeout-minutes: 30
    # PR smoke is signal-only. Nightly/manual runs still fail hard.
    continue-on-error: ${{ github.event_name == 'pull_request' }}

    env:
      PATH: /opt/homebrew/bin:/opt/homebrew/sbin:/usr/local/bin:/usr/bin:/bin:/usr/sbin:/sbin
      LANG: en_US.UTF-8
      LC_ALL: en_US.UTF-8

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Pre-flight
        id: preflight
        # Same shape as ci.yml Pre-flight, plus the staging-only eval
        # attestation broker config. Secrets stay in env vars and are never
        # passed as CLI arguments.
        env:
          VOLUMEARC_RELAY_BASE_URL: ${{ secrets.VOLUMEARC_EVAL_RELAY_BASE_URL }}
          VOLUMEARC_EVAL_ATTEST_BROKER_TOKEN: ${{ secrets.VOLUMEARC_EVAL_ATTEST_BROKER_TOKEN }}
        run: |
          set -euo pipefail
          command -v node >/dev/null || { echo "::error::node missing"; exit 1; }
          command -v jq >/dev/null || { echo "::error::jq missing (brew install jq)"; exit 1; }
          if [[ -z "${VOLUMEARC_RELAY_BASE_URL:-}" ]]; then
            if [[ "${GITHUB_EVENT_NAME}" == "pull_request" ]]; then
              echo "::warning::VOLUMEARC_EVAL_RELAY_BASE_URL secret is not configured; skipping PR coach-eval smoke."
              echo "skip=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            echo "::error::VOLUMEARC_EVAL_RELAY_BASE_URL secret is not configured"
            exit 1
          fi
          if [[ "${VOLUMEARC_RELAY_BASE_URL%/}" == "https://relay.volumearc.app" ]]; then
            echo "::error::Coach response evals must target the staging relay broker, not production"
            exit 1
          fi
          if [[ -z "${VOLUMEARC_EVAL_ATTEST_BROKER_TOKEN:-}" ]]; then
            if [[ "${GITHUB_EVENT_NAME}" == "pull_request" ]]; then
              echo "::warning::VOLUMEARC_EVAL_ATTEST_BROKER_TOKEN secret is not configured; skipping PR coach-eval smoke."
              echo "skip=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            echo "::error::VOLUMEARC_EVAL_ATTEST_BROKER_TOKEN secret is not configured"
            exit 1
          fi
          echo "skip=false" >> "$GITHUB_OUTPUT"
          echo "Pre-flight OK"
        shell: bash

      - name: Run coach evals
        id: evals
        if: steps.preflight.outputs.skip != 'true'
        env:
          VOLUMEARC_EVAL_OUTPUT_DIR: ${{ runner.temp }}/coach-evals/${{ github.run_id }}-${{ github.run_attempt }}
          VOLUMEARC_RELAY_BASE_URL: ${{ secrets.VOLUMEARC_EVAL_RELAY_BASE_URL }}
          VOLUMEARC_EVAL_ATTEST_BROKER_TOKEN: ${{ secrets.VOLUMEARC_EVAL_ATTEST_BROKER_TOKEN }}
          VOLUMEARC_EVAL_FIXTURE_IDS: ${{ github.event_name == 'pull_request' && 'progression-with-high-recovery,planning-week-upper-lower,redflag-chest-pain-mid-set,injection-question-ignore-system,injection-pain-bypass' || '' }}
          RELAY_URL_OVERRIDE: ${{ github.event.inputs.relay_url || '' }}
        run: |
          set -euo pipefail
          if [[ -n "${RELAY_URL_OVERRIDE}" ]]; then
            RELAY_URL_OVERRIDE="$RELAY_URL_OVERRIDE" \
              CONFIGURED_RELAY_URL="$VOLUMEARC_RELAY_BASE_URL" \
              node <<'NODE'
          const override = process.env.RELAY_URL_OVERRIDE ?? "";
          const configured = process.env.CONFIGURED_RELAY_URL ?? "";

          let overrideUrl;
          let configuredUrl;
          try {
            overrideUrl = new URL(override);
            configuredUrl = new URL(configured);
          } catch {
            console.error("::error::relay_url override must be a valid absolute URL");
            process.exit(1);
          }

          if (overrideUrl.protocol !== "https:") {
            console.error("::error::relay_url override must use https");
            process.exit(1);
          }
          if (overrideUrl.hostname === "relay.volumearc.app") {
            console.error("::error::Coach response evals must target staging, not production");
            process.exit(1);
          }
          if (overrideUrl.origin !== configuredUrl.origin) {
            console.error("::error::relay_url override origin must match the configured staging relay origin");
            process.exit(1);
          }
          NODE
            export VOLUMEARC_RELAY_BASE_URL="${RELAY_URL_OVERRIDE}"
          fi
          set +e
          bash scripts/run_coach_evals.sh
          eval_exit=$?
          set -e

          # Surface the run dir as a step output for the next step's
          # parsing logic. The workflow passes a run-scoped directory
          # to avoid cross-run residue on the persistent self-hosted
          # runner temp volume.
          latest="$VOLUMEARC_EVAL_OUTPUT_DIR"
          if [[ ! -d "$latest" ]]; then
            echo "::error::run_coach_evals.sh produced no output directory"
            exit 1
          fi
          echo "run_dir=$latest" >> "$GITHUB_OUTPUT"
          echo "eval_exit=$eval_exit" >> "$GITHUB_OUTPUT"
          echo "Latest run dir: $latest"
        shell: bash

      - name: Parse summary + append trend
        id: trend
        if: steps.preflight.outputs.skip != 'true'
        run: |
          set -euo pipefail
          run_dir="${{ steps.evals.outputs.run_dir }}"
          summary="$run_dir/summary.json"
          if [[ ! -f "$summary" ]]; then
            echo "::error::summary.json missing at $summary"
            exit 1
          fi

          total=$(jq -r '.total' "$summary")
          passed=$(jq -r '.passed' "$summary")
          failed=$(jq -r '.failed' "$summary")
          fixtures=$(jq -c '.fixtures // []' "$summary")
          axes=$(jq -c '
            def summarize($field):
              sort_by(.[$field] // "unknown")
              | group_by(.[$field] // "unknown")
              | map({
                  label: ((.[0][$field] // "unknown") | tostring),
                  total: length,
                  passed: (map(select(.verdict == "PASS")) | length),
                  failed: (map(select(.verdict != "PASS")) | length)
                });

            (.fixtures // []) as $fixtures
            | {
                readiness: (
                  $fixtures
                  | map(. + {
                      readinessBucket: (
                        if .readiness == null then "unknown"
                        elif .readiness < 60 then "<60"
                        elif .readiness < 75 then "60-74"
                        elif .readiness < 85 then "75-84"
                        else "85+"
                        end
                      )
                    })
                  | summarize("readinessBucket")
                ),
                intent: ($fixtures | summarize("intent")),
                style: ($fixtures | summarize("style"))
              }
          ' "$summary")
          echo "Eval results: $passed/$total passed, $failed failed"

          # Append to docs/coach-eval-trend.json (parallel to the
          # docs/coverage-trend.json file VOL-166 wired up). The trend
          # commit only fires when the job is invoked from `main`
          # via cron — workflow_dispatch from a feature branch should
          # not modify the trend file.
          trend_file="docs/coach-eval-trend.json"
          if [[ ! -f "$trend_file" ]]; then
            echo '{"records":[]}' > "$trend_file"
          fi
          timestamp=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          record=$(jq -n \
            --arg ts "$timestamp" \
            --arg sha "${GITHUB_SHA}" \
            --arg run_id "${GITHUB_RUN_ID}" \
            --argjson total "$total" \
            --argjson passed "$passed" \
            --argjson failed "$failed" \
            --argjson axes "$axes" \
            --argjson fixtures "$fixtures" \
            '{timestamp: $ts, sha: $sha, run_id: $run_id, total: $total, passed: $passed, failed: $failed, axes: $axes, fixtures: $fixtures}')

          # Append while preserving prior records.
          tmp=$(mktemp)
          jq --argjson r "$record" '.records += [$r]' "$trend_file" > "$tmp"
          mv "$tmp" "$trend_file"
          mkdir -p marketing/src/data
          cp "$trend_file" marketing/src/data/coach-eval-trend.json

          # Re-fail the job if any fixture failed. The trend record
          # captures the result regardless.
          if [[ "$failed" -gt 0 ]]; then
            echo "::warning::$failed of $total coach-eval fixtures failed assertions"
            # Future: open a regression Linear ticket here (VOL-147
            # AC #5). For v1 we just fail the workflow so the cron
            # email and the GitHub Actions Security tab surface it.
            exit 1
          fi
        shell: bash

      - name: Upload eval results artifact
        if: always() && steps.preflight.outputs.skip != 'true' && steps.evals.outputs.run_dir != ''
        uses: actions/upload-artifact@v7
        with:
          name: coach-eval-results-${{ github.run_id }}
          path: ${{ steps.evals.outputs.run_dir }}/
          retention-days: 30

      - name: Commit trend update on main cron
        # Only the daily cron on main writes to the tracked trend file.
        # workflow_dispatch on a feature branch (operator staging
        # checks) doesn't commit. Mirrors VOL-166's coverage-trend
        # commit pattern.
        if: |
          always() &&
          github.event_name == 'schedule' &&
          github.ref == 'refs/heads/main'
        run: |
          set -euo pipefail
          if ! git diff --quiet docs/coach-eval-trend.json marketing/src/data/coach-eval-trend.json; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add docs/coach-eval-trend.json
            git add marketing/src/data/coach-eval-trend.json
            git commit -m "chore(coach-evals): append nightly trend record"
            git push
          else
            echo "No trend changes to commit (no-op record)"
          fi
        shell: bash
