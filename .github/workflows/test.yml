name: Beast Mode Tests

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  schedule:
    # Run nightly tests at 2 AM UTC
    - cron: '0 2 * * *'
  workflow_dispatch:
    inputs:
      test_plan:
        description: 'Test plan to run'
        required: false
        default: 'BeastMode-CI'
        type: choice
        options:
          - BeastMode
          - BeastMode-CI
          - BeastMode-Nightly

env:
  DEVELOPER_DIR: /Applications/Xcode_15.4.app/Contents/Developer
  SCHEME: BeastMode
  WATCH_SCHEME: BeastModeWatch
  IOS_DESTINATION: 'platform=iOS Simulator,name=iPhone 15 Pro,OS=17.5'
  WATCHOS_DESTINATION: 'platform=watchOS Simulator,name=Apple Watch Series 9 (45mm),OS=10.5'

jobs:
  # iOS Unit and Integration Tests
  test-ios:
    name: iOS Tests
    runs-on: macos-14
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_15.4.app

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Cache Swift packages
        uses: actions/cache@v4
        with:
          path: |
            ~/Library/Caches/org.swift.swiftpm
            .build
          key: ${{ runner.os }}-spm-${{ hashFiles('**/Package.resolved') }}
          restore-keys: |
            ${{ runner.os }}-spm-

      - name: Resolve packages
        run: |
          xcodebuild -resolvePackageDependencies \
            -scheme "$SCHEME" \
            -destination "$IOS_DESTINATION"

      - name: Build for testing
        run: |
          xcodebuild build-for-testing \
            -scheme "$SCHEME" \
            -destination "$IOS_DESTINATION" \
            -testPlan "${{ github.event.inputs.test_plan || 'BeastMode-CI' }}" \
            -derivedDataPath DerivedData \
            CODE_SIGNING_ALLOWED=NO

      - name: Run iOS tests
        run: |
          xcodebuild test-without-building \
            -scheme "$SCHEME" \
            -destination "$IOS_DESTINATION" \
            -testPlan "${{ github.event.inputs.test_plan || 'BeastMode-CI' }}" \
            -derivedDataPath DerivedData \
            -resultBundlePath TestResults-iOS.xcresult \
            CODE_SIGNING_ALLOWED=NO

      - name: Generate coverage report
        if: always()
        run: |
          xcrun xccov view --report --json TestResults-iOS.xcresult > coverage-ios.json || true
          python3 scripts/check_coverage.py coverage-ios.json 80.0 || true

      - name: Upload iOS test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ios-test-results
          path: TestResults-iOS.xcresult
          retention-days: 7

      - name: Upload iOS coverage report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ios-coverage-report
          path: coverage-ios.json
          retention-days: 7

  # watchOS Unit Tests
  test-watchos:
    name: watchOS Tests
    runs-on: macos-14
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_15.4.app

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Cache Swift packages
        uses: actions/cache@v4
        with:
          path: |
            ~/Library/Caches/org.swift.swiftpm
            .build
          key: ${{ runner.os }}-spm-${{ hashFiles('**/Package.resolved') }}
          restore-keys: |
            ${{ runner.os }}-spm-

      - name: Resolve packages
        run: |
          xcodebuild -resolvePackageDependencies \
            -scheme "$WATCH_SCHEME" \
            -destination "$WATCHOS_DESTINATION"

      - name: Build watchOS for testing
        run: |
          xcodebuild build-for-testing \
            -scheme "$WATCH_SCHEME" \
            -destination "$WATCHOS_DESTINATION" \
            -derivedDataPath DerivedData \
            CODE_SIGNING_ALLOWED=NO

      - name: Run watchOS tests
        run: |
          xcodebuild test-without-building \
            -scheme "$WATCH_SCHEME" \
            -destination "$WATCHOS_DESTINATION" \
            -derivedDataPath DerivedData \
            -resultBundlePath TestResults-watchOS.xcresult \
            CODE_SIGNING_ALLOWED=NO

      - name: Generate watchOS coverage report
        if: always()
        run: |
          xcrun xccov view --report --json TestResults-watchOS.xcresult > coverage-watchos.json || true

      - name: Upload watchOS test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: watchos-test-results
          path: TestResults-watchOS.xcresult
          retention-days: 7

      - name: Upload watchOS coverage report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: watchos-coverage-report
          path: coverage-watchos.json
          retention-days: 7

  # Nightly Tests (full suite with sanitizers)
  nightly:
    name: Nightly Full Test Suite
    runs-on: macos-14
    timeout-minutes: 90
    if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && github.event.inputs.test_plan == 'BeastMode-Nightly')

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_15.4.app

      - name: Cache Swift packages
        uses: actions/cache@v4
        with:
          path: |
            ~/Library/Caches/org.swift.swiftpm
            .build
          key: ${{ runner.os }}-spm-${{ hashFiles('**/Package.resolved') }}
          restore-keys: |
            ${{ runner.os }}-spm-

      - name: Resolve packages (iOS)
        run: |
          xcodebuild -resolvePackageDependencies \
            -scheme "$SCHEME" \
            -destination "$IOS_DESTINATION"

      - name: Build iOS for nightly testing
        run: |
          xcodebuild build-for-testing \
            -scheme "$SCHEME" \
            -destination "$IOS_DESTINATION" \
            -testPlan "BeastMode-Nightly" \
            -derivedDataPath DerivedData \
            CODE_SIGNING_ALLOWED=NO

      - name: Run iOS nightly tests
        run: |
          xcodebuild test-without-building \
            -scheme "$SCHEME" \
            -destination "$IOS_DESTINATION" \
            -testPlan "BeastMode-Nightly" \
            -derivedDataPath DerivedData \
            -resultBundlePath NightlyResults-iOS.xcresult \
            CODE_SIGNING_ALLOWED=NO

      - name: Build watchOS for nightly testing
        run: |
          xcodebuild build-for-testing \
            -scheme "$WATCH_SCHEME" \
            -destination "$WATCHOS_DESTINATION" \
            -derivedDataPath DerivedData \
            CODE_SIGNING_ALLOWED=NO

      - name: Run watchOS nightly tests
        run: |
          xcodebuild test-without-building \
            -scheme "$WATCH_SCHEME" \
            -destination "$WATCHOS_DESTINATION" \
            -derivedDataPath DerivedData \
            -resultBundlePath NightlyResults-watchOS.xcresult \
            CODE_SIGNING_ALLOWED=NO

      - name: Generate iOS nightly coverage report
        if: always()
        run: |
          xcrun xccov view --report --json NightlyResults-iOS.xcresult > nightly-coverage-ios.json || true
          python3 scripts/check_coverage.py nightly-coverage-ios.json 90.0 || true

      - name: Generate watchOS nightly coverage report
        if: always()
        run: |
          xcrun xccov view --report --json NightlyResults-watchOS.xcresult > nightly-coverage-watchos.json || true

      - name: Upload nightly iOS results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nightly-ios-results
          path: NightlyResults-iOS.xcresult
          retention-days: 14

      - name: Upload nightly watchOS results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nightly-watchos-results
          path: NightlyResults-watchOS.xcresult
          retention-days: 14

      - name: Notify on failure
        if: failure()
        run: |
          echo "::error::Nightly tests failed! Check the test results for details."

  # Build verification
  build:
    name: Build Verification
    runs-on: macos-14
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_15.4.app

      - name: Cache Swift packages
        uses: actions/cache@v4
        with:
          path: |
            ~/Library/Caches/org.swift.swiftpm
            .build
          key: ${{ runner.os }}-spm-${{ hashFiles('**/Package.resolved') }}
          restore-keys: |
            ${{ runner.os }}-spm-

      - name: Build iOS
        run: |
          xcodebuild build \
            -scheme "$SCHEME" \
            -destination "$IOS_DESTINATION" \
            -derivedDataPath DerivedData \
            CODE_SIGNING_ALLOWED=NO

      - name: Build watchOS
        run: |
          xcodebuild build \
            -scheme "$WATCH_SCHEME" \
            -destination "$WATCHOS_DESTINATION" \
            -derivedDataPath DerivedData \
            CODE_SIGNING_ALLOWED=NO

  # Code quality checks
  lint:
    name: Code Quality
    runs-on: macos-14
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install SwiftLint
        run: brew install swiftlint

      - name: Run SwiftLint
        run: swiftlint lint --reporter github-actions-logging
        continue-on-error: true

      - name: Check for TODO/FIXME
        run: |
          echo "Checking for TODO and FIXME comments..."
          TODOS=$(grep -rn "TODO\|FIXME" --include="*.swift" BeastMode/ BeastModeWatch/ || true)
          if [ -n "$TODOS" ]; then
            echo "::warning::Found TODO/FIXME comments:"
            echo "$TODOS"
          fi
