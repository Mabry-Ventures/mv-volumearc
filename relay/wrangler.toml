#:schema node_modules/wrangler/config-schema.json
name = "volumearc-ai-relay"
main = "src/worker.ts"
compatibility_date = "2026-04-23"
compatibility_flags = ["nodejs_compat"]

# `volumearc.app` is on Cloudflare DNS (NS = ali/karl.ns.cloudflare.com),
# so `custom_domain = true` lets Wrangler auto-provision the DNS record
# and TLS cert for `relay.volumearc.app` on the next deploy.
# `VolumeArcAIConfiguration.allowedHosts` already accepts both this and
# the auto-assigned `volumearc-ai-relay.jared-b6b.workers.dev` subdomain
# so the iOS app continues to work whichever URL is set in
# `VOLUMEARC_AI_RELAY_URL`.
[[routes]]
pattern = "relay.volumearc.app"
custom_domain = true

# Rate limit KV namespace. Created via `wrangler kv:namespace create RATE_LIMIT`
# or the Cloudflare MCP `kv_namespace_create` tool. The `id` is populated
# by the one-time setup; `preview_id` is only used in local `wrangler dev`.
[[kv_namespaces]]
binding = "RATE_LIMIT"
id = "efcd4b67b0984a219559ffa37c65ceed"

[[durable_objects.bindings]]
name = "APP_ATTEST_STATE"
class_name = "AppAttestState"

[[migrations]]
tag = "v1_app_attest_state"
new_sqlite_classes = ["AppAttestState"]

[observability]
enabled = true

# Secrets (configured via `wrangler secret put <NAME>`):
#   GEMINI_API_KEY     — Google AI Studio API key, never in source
#   EVAL_ATTEST_BROKER_TOKEN — staging-only coach-eval broker token; do not
#                              configure on production `relay.volumearc.app`
#
# App Attest stores attested keys/challenges in the APP_ATTEST_STATE Durable
# Object so challenge consume + assertion counter updates are strongly
# consistent. The Worker still has KV fallback code for local tests and
# emergency rollback builds that omit the Durable Object binding.

[vars]
# Model selection. Can be overridden per-request via X-Coach-Tier header
# (`flash-lite` default / `pro` premium). Swapping models here is a deploy
# away — no iOS release needed.
# Gemini 3.1 is currently shipped as -preview. These tags are documented
# in Google AI Studio. Switch to unqualified names (or -latest aliases)
# once Google promotes them to stable. Swapping a model is a deploy, no
# iOS release.
MODEL_DEFAULT = "gemini-3.1-flash-lite-preview"
MODEL_PREMIUM = "gemini-3.1-pro-preview"
MAX_OUTPUT_TOKENS = "800"
REQUEST_TIMEOUT_MS = "60000"
RATE_LIMIT_MAX_REQUESTS = "30"
RATE_LIMIT_WINDOW_SECONDS = "600"

# App Attest validation.
APPLE_TEAM_ID = "A886EMZZW6"
APPLE_BUNDLE_ID = "com.mabryventures.VolumeArc"

# Staging-only coach response evals can enable:
#   EVAL_ATTEST_BROKER_ENABLED = "true"
#   EVAL_ATTEST_BROKER_KEY_TTL_SECONDS = "86400"
# Keep these unset for production. The Worker also refuses broker requests on
# the production relay hostname as a second guard.
