#:schema node_modules/wrangler/config-schema.json
name = "volumearc-ai-relay"
main = "src/worker.ts"
compatibility_date = "2026-04-23"
compatibility_flags = ["nodejs_compat"]

# `volumearc.app` is on Cloudflare DNS (NS = ali/karl.ns.cloudflare.com),
# so `custom_domain = true` lets Wrangler auto-provision the DNS record
# and TLS cert for `relay.volumearc.app` on the next deploy.
# `VolumeArcAIConfiguration.allowedHosts` already accepts both this and
# the auto-assigned `volumearc-ai-relay.jared-b6b.workers.dev` subdomain
# so the iOS app continues to work whichever URL is set in
# `VOLUMEARC_AI_RELAY_URL`.
[[routes]]
pattern = "relay.volumearc.app"
custom_domain = true

# Rate limit KV namespace. Created via `wrangler kv:namespace create RATE_LIMIT`
# or the Cloudflare MCP `kv_namespace_create` tool. The `id` is populated
# by the one-time setup; `preview_id` is only used in local `wrangler dev`.
[[kv_namespaces]]
binding = "RATE_LIMIT"
id = "efcd4b67b0984a219559ffa37c65ceed"

[[durable_objects.bindings]]
name = "APP_ATTEST_STATE"
class_name = "AppAttestState"

[[durable_objects.bindings]]
name = "EVAL_ATTEST_STATE"
class_name = "EvalAttestState"

[[migrations]]
tag = "v1_app_attest_state"
new_sqlite_classes = ["AppAttestState"]

[[migrations]]
tag = "v2_eval_attest_state"
new_sqlite_classes = ["EvalAttestState"]

[observability]
enabled = true

# Secrets (configured via `wrangler secret put <NAME>`):
#   GEMINI_API_KEY     — Google AI Studio API key, never in source
#   EVAL_ATTEST_BROKER_TOKEN — staging-only coach-eval broker token; do not
#                              configure on production `relay.volumearc.app`
#
# App Attest stores attested keys/challenges in the APP_ATTEST_STATE Durable
# Object so challenge consume + assertion counter updates are strongly
# consistent. The Worker still has KV fallback code for local tests and
# emergency rollback builds that omit the Durable Object binding.

[vars]
# Model selection. Can be overridden per-request via X-Coach-Tier header
# (`flash-lite` default / `pro` premium). Swapping models here is a deploy
# away — no iOS release needed.
#
# VolumeArc Release model routing:
#   * Free/default stays on the stable, low-latency `gemini-3.1-flash-lite`.
#     Google lists an earliest shutdown date of 2027-05-07, so this must be
#     reviewed before launch and again every quarter.
#   * Premium pins to stable `gemini-3.5-flash` instead of the hot-swapped
#     `gemini-flash-latest` alias. Google's model-version guidance says most
#     production apps should use a specific stable model; latest aliases can
#     change underneath the app with notice.
# Future deprecation regressions should be caught earlier by the nightly
# coach-eval workflow (VOL-245); the previous miss happened because the
# nightly workflow was failing on a missing-secret config error before
# the evals could surface the upstream-model issue.
MODEL_DEFAULT = "gemini-3.1-flash-lite"
MODEL_PREMIUM = "gemini-3.5-flash"
# 4096, not 800: the premium tier is a thinking model whose thoughts bill
# against this budget. At 800 total, thinking starved the visible answer
# to mid-word cutoffs (eval 27452720641); 4096 leaves room for a complete
# answer after a bounded 512-token thinking budget. Billed on tokens
# actually generated, so short answers don't cost the full budget.
MAX_OUTPUT_TOKENS = "4096"
REQUEST_TIMEOUT_MS = "45000"
RATE_LIMIT_MAX_REQUESTS = "30"
RATE_LIMIT_WINDOW_SECONDS = "600"

# App Attest validation.
APPLE_TEAM_ID = "A886EMZZW6"
APPLE_BUNDLE_ID = "com.mabryventures.VolumeArc"

# Staging-only coach response evals can enable all three vars:
#   EVAL_ATTEST_BROKER_ENABLED = "true"
#   EVAL_ATTEST_BROKER_ALLOWED_HOSTS = "staging-relay.volumearc.app"
#   EVAL_ATTEST_BROKER_KEY_TTL_SECONDS = "86400"
# Keep these unset for production. The broker fails closed unless the request
# host is on the explicit allowlist and the EVAL_ATTEST_STATE Durable Object is
# bound, so preview/custom hostnames do not inherit the staging auth path.
