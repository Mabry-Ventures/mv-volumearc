# CodeRabbit Pro configuration for VolumeArc
# https://docs.coderabbit.ai/getting-started/configure-coderabbit

language: en-US
tone_instructions: "Be direct and concrete. Cite file:line. Flag launch-affecting issues (App Store, privacy, security) with higher severity than style nits. Skip the poem."

early_access: false

reviews:
  profile: assertive
  request_changes_workflow: true
  high_level_summary: true
  poem: false
  review_status: true
  collapse_walkthrough: false
  auto_review:
    enabled: true
    drafts: false
    base_branches:
      - main
  path_filters:
    - "!VolumeArcApple.xcodeproj/**"
    - "!**/*.pbxproj"
    - "!**/*.generated.swift"
    - "!build/**"
    - "!.build/**"
    - "!.claude/**"
    - "!fastlane/report.xml"
    - "!fastlane/*.log"
  path_instructions:
    - path: "VolumeArcNative/Sources/VolumeArcCore/**/*.swift"
      instructions: |
        Core module. No SwiftUI or UIKit imports allowed. Flag any Core file
        that imports a UI framework. Enforce Sendable/actor boundaries for
        anything crossing an async boundary. Flag `try!` or force-unwraps.
    - path: "VolumeArcNative/Sources/VolumeArcUI/**/*.swift"
      instructions: |
        UI module. Every visual property must come from `VA.Colors`,
        `VA.Typography`, `VA.Space`, `VA.Radius`, or `VA.Shadow`. Every user-facing
        string must use `String(localized:comment:)`. Every haptic must go
        through `VAHaptics.*`. Enum display labels must live in
        `LocalizedLabels.swift`, not inline.
    - path: "scripts/generate_xcode_project.rb"
      instructions: |
        Custom (non-Apple-recognized) Info.plist keys cannot be expressed via
        `INFOPLIST_KEY_*` — they must live in `App/Info.plist`. Array-valued keys
        likewise. Flag any attempt to add custom keys to INFOPLIST_KEY_*.
    - path: "docs/PLATFORM.md"
      instructions: |
        This is the canonical source of truth. Any PR that changes the
        implementation status of a system must update the status table row
        here in the same PR. Flag status drift between this file and code.
    - path: ".github/workflows/**"
      instructions: |
        Flag any silently skipped required steps (e.g., `|| true`, warning-only
        lint, optional test runs on required paths). Required gates must
        hard-fail, not warn.

chat:
  auto_reply: true
