included:
  - App
  - Watch
  - Widgets
  - WatchWidgets
  - Tests
  - VolumeArcNative/Sources

excluded:
  - build
  - DerivedData
  - VolumeArcApple.xcodeproj

disabled_rules:
  - trailing_comma
  - opening_brace
  - multiple_closures_with_trailing_closure

opt_in_rules:
  - closure_spacing
  - empty_count
  - empty_string
  - fatal_error_message
  - first_where
  - force_unwrapping
  - implicitly_unwrapped_optional
  - last_where
  - modifier_order
  - overridden_super_call
  - private_action
  - private_outlet
  - redundant_nil_coalescing
  - sorted_first_last
  - unowned_variable_capture
  - vertical_whitespace_closing_braces

# Length thresholds (VOL-87): warnings reduced to bite-sized levels that
# all current sources clear, so CI can run with `--strict` and surface
# real regressions instead of accumulating debt. Errors stay generous so
# brief refactors that temporarily push a file past the warning line
# still build locally during development; CI's `--strict` mode promotes
# warnings to failures regardless.
line_length:
  warning: 150
  error: 250

type_body_length:
  warning: 400
  error: 800

file_length:
  warning: 500
  error: 1200

function_body_length:
  warning: 60
  error: 200

# VOL-87: `OutboundSyncQueue` protocol's `stage` / `enqueue` methods
# legitimately take 6 parameters (record type, identifier, operation,
# payload JSON, queuedAt, plus the model-context for `stage`). Bumping
# the warning threshold to 6 keeps that API readable as a flat
# parameter list — a wrapper struct would obscure the SwiftData write
# call site without removing complexity.
function_parameter_count:
  warning: 6
  error: 8

# VOL-87: `pullChanges` and the AI prompt-evaluation path each branch
# more than 10 ways because they're closure-driven CloudKit / network
# response handlers — splitting them would just hide the branches
# behind helpers that all need the same surrounding state. Bumping
# the warning threshold to 15 keeps the warning tight while letting
# these documented handlers pass.
cyclomatic_complexity:
  warning: 15
  error: 25

identifier_name:
  min_length: 2
  excluded:
    - id
    - to
    - x
    - y
    # VOL-87: `s` is the canonical sentence/string-fragment binding inside
    # the Onboarding view and a handful of Tests, used in tight scopes
    # where a longer name reads as noise.
    - s
    # VOL-87: `i` is the canonical loop-counter inside test fixtures.
    - i

# VOL-87: `VA` is the project's design-token namespace
# (`VA.Colors`, `VA.Typography`, etc.). The two-character name is a
# project-wide convention enforced by the contributor guide — every
# visual property in iOS/watchOS code reaches into it. The watch and
# watch-widget targets re-declare the same namespace because they
# can't import `VolumeArcUI` (iOS-only), so excluding `VA` lets all
# three declarations pass `type_name`.
type_name:
  min_length: 3
  excluded:
    - VA

nesting:
  type_level: 3
  function_level: 3

reporter: xcode
