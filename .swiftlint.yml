included:
  - App
  - Watch
  - Widgets
  - WatchWidgets
  - Tests
  - VolumeArcNative/Sources

excluded:
  - build
  - DerivedData
  - VolumeArcApple.xcodeproj

disabled_rules:
  - trailing_comma
  - opening_brace
  - multiple_closures_with_trailing_closure

opt_in_rules:
  - closure_spacing
  - empty_count
  - empty_string
  - fatal_error_message
  - first_where
  - force_unwrapping
  - implicitly_unwrapped_optional
  - last_where
  - modifier_order
  - overridden_super_call
  - private_action
  - private_outlet
  - redundant_nil_coalescing
  - sorted_first_last
  - unowned_variable_capture
  - vertical_whitespace_closing_braces

# Error thresholds raised 2026-04-22 to accommodate existing violations
# surfaced when SwiftLint finally ran in CI (VOL-77). Warning levels kept
# tight so the debt stays visible in the CI log. VOL-87 tracks the
# progressive tightening back as files are refactored.
line_length:
  warning: 150
  error: 250

type_body_length:
  warning: 400
  error: 800

file_length:
  warning: 500
  error: 1200

function_body_length:
  warning: 60
  error: 200

identifier_name:
  min_length: 2
  excluded:
    - id
    - to
    - x
    - y

nesting:
  type_level: 3
  function_level: 3

reporter: xcode
